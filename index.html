<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF3D8B" />
  <meta name="description" content="Sign in to your XFusion account." />
  <title>XFusion — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />

  <style>
    /* ===== XFusion Login — standalone premium shell ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --xf-bg:#fff8fb; --xf-surface:#ffffff; --xf-surface-2:#fdf3f8;
      --xf-line:rgba(255,61,139,.14); --xf-text:#2b2330; --xf-mid:#4a3f52;
      --xf-muted:#6f6478; --xf-placeholder:#b8aec0; --xf-ink:#2b2330;
      --xf-accent:#d01563; --xf-accent-2:#ff3d8b; --xf-pink:#ff3d8b;
      --xf-pink-deep:#d01563; --xf-pink-soft:#ffe3ef; --xf-lemon:#ffe23d;
      --xf-yellow:#ffc93c; --xf-hero-dark:#8a0e42;
      --xf-sweep:linear-gradient(135deg,var(--xf-pink) 0%,var(--xf-yellow) 55%,var(--xf-lemon) 100%);
      --xf-hero:linear-gradient(135deg,var(--xf-hero-dark) 0%,var(--xf-accent) 52%,var(--xf-accent-2) 100%);
      --xf-focus:0 0 0 4px rgba(255,61,139,.16);
      --xf-ease:cubic-bezier(.23,1,.32,1);
    }

    html,body { min-height:100%; }
    body {
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--xf-text);
      background:
        radial-gradient(circle at 0% 0%, rgba(255,61,139,.08), transparent 32rem),
        radial-gradient(circle at 100% 100%, rgba(255,226,61,.12), transparent 34rem),
        var(--xf-bg);
      display:flex; align-items:center; justify-content:center;
      padding:clamp(14px,4vw,40px);
      padding-bottom:calc(clamp(14px,4vw,40px) + env(safe-area-inset-bottom));
      -webkit-text-size-adjust:100%; overflow-x:hidden;
    }

    .xf-shell {
      width:min(100%,980px);
      background:var(--xf-surface);
      border:1px solid var(--xf-line);
      border-radius:28px;
      box-shadow:0 30px 70px -24px rgba(208,21,99,.28), 0 0 0 1px rgba(255,61,139,.04);
      overflow:hidden;
      animation:xfUp .6s var(--xf-ease) both;
    }

    .xf-brand { position:relative; color:#fff; padding:26px 24px 24px; background:var(--xf-hero); overflow:hidden; }
    .xf-brand::before { content:''; position:absolute; top:-60px; right:-50px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,226,61,.30), transparent 70%); }
    .xf-brand::after { content:''; position:absolute; bottom:-70px; left:-40px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); }
    .xf-brand-inner { position:relative; z-index:1; }
    .xf-mark { display:flex; align-items:center; gap:11px; }
    .xf-diamond { width:16px; height:16px; border-radius:5px; transform:rotate(45deg); background:var(--xf-sweep); box-shadow:0 0 0 5px rgba(255,255,255,.18); flex:0 0 auto; }
    .xf-word { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
    .xf-tag { margin-top:6px; font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.82); font-weight:600; }
    .xf-claim { margin-top:18px; font-family:'Playfair Display',serif; font-size:clamp(1.4rem,5vw,1.85rem); line-height:1.18; font-weight:700; letter-spacing:-.01em; }
    .xf-claim em { font-style:normal; color:var(--xf-lemon); }
    .xf-trust { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .xf-trust span { display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:99px; font-size:.68rem; font-weight:700; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); color:#fff; }
    .xf-trust svg { width:13px; height:13px; stroke:var(--xf-lemon); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

    .xf-form { padding:clamp(22px,5vw,38px); }
    .xf-eyebrow { font-size:.7rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--xf-accent); }
    .xf-h { margin-top:6px; font-family:'Playfair Display',serif; font-size:clamp(1.5rem,5vw,1.95rem); font-weight:800; letter-spacing:-.02em; color:var(--xf-text); }
    .xf-sub { margin-top:8px; font-size:.86rem; line-height:1.6; color:var(--xf-muted); }

    .xf-alert { display:none; margin:18px 0 4px; padding:13px 15px; border-radius:14px; font-size:.82rem; font-weight:700; line-height:1.45; }
    .xf-alert.show { display:block; animation:xfUp .3s var(--xf-ease) both; }
    .xf-alert.error { background:#ffe4e9; color:#9f1239; border:1px solid #ffc2cf; }
    .xf-alert.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }

    .xf-fields { margin-top:18px; display:grid; gap:15px; }
    .xf-field { position:relative; }
    .xf-field > label { display:block; margin-bottom:7px; font-size:.74rem; font-weight:800; color:var(--xf-mid); }
    .xf-inputwrap { position:relative; display:flex; align-items:center; }
    .xf-inputwrap > .xf-ico { position:absolute; left:14px; width:18px; height:18px; stroke:var(--xf-placeholder); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; transition:stroke .18s ease; }
    .xf-inputwrap input { width:100%; min-height:54px; padding:0 16px 0 44px; font-family:inherit; font-size:16px; font-weight:500; color:var(--xf-text); background:var(--xf-surface-2); border:1.5px solid var(--xf-line); border-radius:15px; outline:none; transition:border-color .18s ease, box-shadow .18s ease, background .18s ease; }
    .xf-inputwrap input::placeholder { color:var(--xf-placeholder); }
    .xf-inputwrap input:focus { background:#fff; border-color:var(--xf-accent-2); box-shadow:var(--xf-focus); }
    .xf-inputwrap:focus-within > .xf-ico { stroke:var(--xf-accent); }
    .xf-inputwrap.has-toggle input { padding-right:50px; }
    .xf-eye { position:absolute; right:8px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; border-radius:10px; cursor:pointer; color:var(--xf-muted); transition:color .15s ease, background .15s ease; }
    .xf-eye:hover { color:var(--xf-accent); background:var(--xf-pink-soft); }
    .xf-eye svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .xf-eye .off { display:none; }
    .xf-eye.is-on .on { display:none; }
    .xf-eye.is-on .off { display:block; }

    .xf-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:2px; }
    .xf-remember { display:inline-flex; align-items:center; gap:8px; font-size:.78rem; font-weight:600; color:var(--xf-mid); cursor:pointer; user-select:none; }
    .xf-remember input { position:absolute; opacity:0; width:0; height:0; }
    .xf-box { width:18px; height:18px; border-radius:6px; border:1.5px solid var(--xf-line); background:var(--xf-surface-2); display:inline-flex; align-items:center; justify-content:center; transition:all .15s ease; }
    .xf-box svg { width:12px; height:12px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .15s ease; }
    .xf-remember input:checked + .xf-box { background:var(--xf-accent); border-color:var(--xf-accent); }
    .xf-remember input:checked + .xf-box svg { opacity:1; }
    .xf-remember input:focus-visible + .xf-box { box-shadow:var(--xf-focus); }
    .xf-forgot { font-size:.78rem; font-weight:800; color:var(--xf-accent); text-decoration:none; }
    .xf-forgot:hover { color:var(--xf-pink-deep); text-decoration:underline; }

    .xf-submit { width:100%; min-height:56px; margin-top:22px; border:0; border-radius:16px; cursor:pointer; font-family:inherit; font-size:1rem; font-weight:800; letter-spacing:.01em; color:var(--xf-ink); background:var(--xf-sweep); box-shadow:0 14px 28px -8px rgba(208,21,99,.42); display:flex; align-items:center; justify-content:center; gap:9px; transition:transform .18s var(--xf-ease), box-shadow .18s ease, opacity .18s ease; position:relative; overflow:hidden; }
    .xf-submit::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%); transform:translateX(-120%); transition:transform .6s ease; }
    .xf-submit:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 18px 34px -8px rgba(208,21,99,.5); }
    .xf-submit:hover:not(:disabled)::after { transform:translateX(120%); }
    .xf-submit:active:not(:disabled) { transform:scale(.985); }
    .xf-submit:disabled { opacity:.62; cursor:wait; }
    .xf-spin { width:17px; height:17px; border:2.5px solid rgba(43,35,48,.25); border-top-color:var(--xf-ink); border-radius:50%; animation:xfSpin .7s linear infinite; display:none; }
    .xf-submit.loading .xf-spin { display:block; }

    .xf-foot { margin-top:20px; text-align:center; font-size:.84rem; color:var(--xf-muted); }
    .xf-foot a { color:var(--xf-accent); font-weight:800; text-decoration:none; }
    .xf-foot a:hover { color:var(--xf-pink-deep); text-decoration:underline; }

    @keyframes xfUp { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
    @keyframes xfSpin { to{transform:rotate(360deg);} }

    @media (min-width:900px) {
      .xf-shell { display:grid; grid-template-columns:0.92fr 1.08fr; min-height:560px; }
      .xf-brand { display:flex; align-items:center; padding:46px 42px; border-radius:0; }
      .xf-brand-inner { width:100%; }
      .xf-claim { font-size:2.05rem; }
      .xf-form { display:flex; flex-direction:column; justify-content:center; padding:46px 44px; }
    }
    @media (max-width:899px) {
      .xf-claim, .xf-trust { display:none; }
      .xf-brand { padding:20px 22px; }
      .xf-mark .xf-word { font-size:1.35rem; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; }
    }
  </style>
</head>
<!-- config placeholders preserved exactly as the original login shipped (build step / supabase.js reads these) -->
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <main class="xf-shell">
    <aside class="xf-brand">
      <div class="xf-brand-inner">
        <div class="xf-mark">
          <span class="xf-diamond" aria-hidden="true"></span>
          <span class="xf-word">XFusion</span>
        </div>
        <p class="xf-tag">Premium Investing · Reimagined</p>
        <h2 class="xf-claim">Welcome back to your <em>fusion</em> of value.</h2>
        <div class="xf-trust" aria-hidden="true">
          <span><svg viewBox="0 0 24 24"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>Bank‑grade security</span>
          <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>24/7 withdrawals</span>
          <span><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>Daily income</span>
        </div>
      </div>
    </aside>

    <section class="xf-form">
      <p class="xf-eyebrow">Members area</p>
      <h1 class="xf-h">Sign in</h1>
      <p class="xf-sub">Enter your details to access your XFusion dashboard.</p>

      <div id="alert" class="xf-alert" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="xf-fields">
          <div class="xf-field">
            <label for="email">Email address</label>
            <div class="xf-inputwrap">
              <svg class="xf-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>

          <div class="xf-field">
            <label for="password">Password</label>
            <div class="xf-inputwrap has-toggle">
              <svg class="xf-ico" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input type="password" id="password" name="current-password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="xf-eye" id="pwToggle" aria-label="Show password" aria-pressed="false">
                <svg class="on" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a18.4 18.4 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="xf-row">
          <label class="xf-remember">
            <input type="checkbox" id="remember" />
            <span class="xf-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
            Keep me signed in
          </label>
          <a href="forgot-password.html" class="xf-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="xf-submit" id="loginBtn">
          <span class="xf-spin" aria-hidden="true"></span>
          <span id="loginBtnTxt">Sign In</span>
        </button>
      </form>

      <p class="xf-foot">Don't have an account? <a href="register.html">Create one</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };

    function showAlert(msg, type) {
      var el = $("alert");
      el.textContent = msg;
      el.className = "xf-alert show " + (type === "success" ? "success" : "error");
    }
    function hideAlert() { $("alert").className = "xf-alert"; }
    function setLoading(on) {
      var b = $("loginBtn");
      b.disabled = !!on;
      b.classList.toggle("loading", !!on);
      $("loginBtnTxt").textContent = on ? "Signing in…" : "Sign In";
    }

    document.addEventListener("DOMContentLoaded", async function () {
      if (window.SerlzoReady) await window.SerlzoReady;

      /* already signed in? go straight to dashboard */
      if (window.sb) {
        window.sb.auth.getSession().then(function (r) {
          if (r.data && r.data.session) location.href = "/dashboard.html";
        });
      }

      /* password visibility */
      $("pwToggle").addEventListener("click", function () {
        var inp = $("password");
        var show = inp.type === "password";
        inp.type = show ? "text" : "password";
        this.classList.toggle("is-on", show);
        this.setAttribute("aria-pressed", String(show));
        this.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      $("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = $("email").value.trim();
        var pass = $("password").value;
        hideAlert();
        if (!email || !pass) { showAlert("Please fill in all fields.", "error"); return; }
        if (!window.sb) { showAlert("XFusion access is not configured yet. Ask the site administrator to set SUPABASE_URL and SUPABASE_ANON_KEY.", "error"); return; }

        setLoading(true);
        try {
          var res = await window.sb.auth.signInWithPassword({ email: email, password: pass });
          if (res.error) {
            showAlert(res.error.message || "Invalid credentials.", "error");
            setLoading(false); return;
          }
          location.href = "/dashboard.html";
        } catch (err) {
          console.error("Login error:", err);
          showAlert("Unable to sign in right now. Please try again.", "error");
          setLoading(false);
        }
      });

      /* enter-key on either field submits */
      ["email", "password"].forEach(function (id) {
        $(id).addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); $("loginBtn").click(); }
        });
      });
    });
  })();
  </script>
</body>
</html>
