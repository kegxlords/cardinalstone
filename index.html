<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />
</head>
<body class="rp-auth-body" data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <main class="rp-auth-card">
    <aside class="rp-auth-brand">
      <div class="rp-auth-brand-inner">
        <div class="rp-brand">
          <span class="rp-diamond"></span>
          <span class="rp-word">Redpay</span>
        </div>
        <p class="rp-auth-tag">Fast payouts · Secure wallet · Daily income</p>
      </div>
    </aside>

    <section class="rp-auth-panel">
      <p class="rp-eyebrow">Members area</p>
      <h1 class="rp-h">Welcome back</h1>
      <p class="rp-sub">Sign in to your Redpay account to continue.</p>

      <div id="alert" class="alert"></div>

      <div class="rp-fields">
        <div class="rp-field">
          <label for="email">Email Address</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input class="rp-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="rp-field">
          <label for="password">Password</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input class="rp-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:10px;">
        <a href="forgot-password.html" class="section-link">Forgot password?</a>
      </div>

      <button class="rp-btn" type="button" id="loginBtn">Sign In</button>

      <p class="rp-foot">Don't have an account? <a href="register.html">Create one</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      if (window.SerlzoReady) await window.SerlzoReady;

      // Already logged in?
      if (window.sb) {
        window.sb.auth.getSession().then(function (r) {
          if (r.data?.session) location.href = "/dashboard.html";
        });
      }

      document.getElementById("loginBtn").addEventListener("click", async function () {
        var btn   = this;
        var email = document.getElementById("email").value.trim();
        var pass  = document.getElementById("password").value;
        var alert = document.getElementById("alert");

        if (!email || !pass) {
          alert.textContent = "Please fill in all fields.";
          alert.className = "alert alert-error show";
          return;
        }

        if (!window.sb) {
          alert.textContent = "Redpay access is not configured yet. Ask the site administrator to set SUPABASE_URL and SUPABASE_ANON_KEY.";
          alert.className = "alert alert-error show";
          return;
        }

        btn.disabled = true;
        btn.textContent = "Signing in…";
        alert.className = "alert";

        var { data, error } = await window.sb.auth.signInWithPassword({ email, password: pass });

        if (error) {
          alert.textContent = error.message || "Invalid credentials.";
          alert.className = "alert alert-error show";
          btn.disabled = false;
          btn.textContent = "Sign In";
          return;
        }

        location.href = "/dashboard.html";
      });

      // Enter key support
      document.getElementById("password").addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });

      document.getElementById("email").addEventListener("keydown", function (e) {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });
    });
  </script>
  <!-- PASTE YOUR EXISTING LOGIN SCRIPT BLOCK HERE -->
  <!-- Only change: "XFusion access..." -> "Redpay access..." -->
</body>
</html>
