<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    /* ===== XFusion Notifications shell. JS-injected .notif-* / .empty-state classes preserved; paint + structure new. ===== */
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --xf-bg:#fff8fb;--xf-surface:#ffffff;--xf-surface-2:#fdf3f8;--xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330;--xf-mid:#4a3f52;--xf-muted:#6f6478;--xf-ph:#b8aec0;--xf-ink:#2b2330;
      --xf-accent:#d01563;--xf-accent-2:#ff3d8b;--xf-pink-soft:#ffe3ef;--xf-lemon:#ffe23d;--xf-yellow:#ffc93c;--xf-hero-dark:#8a0e42;--xf-danger:#e11d48;--xf-success:#16a34a;
      --xf-sweep:linear-gradient(135deg,#ff3d8b 0%,#ffc93c 55%,#ffe23d 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
      --xf-shadow-sm:0 8px 20px -12px rgba(208,21,99,.22);
    }
    body{background:radial-gradient(circle at 0% 0%,rgba(255,61,139,.06),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(255,226,61,.10),transparent 34rem),var(--xf-bg)!important;color:var(--xf-text)!important;min-height:100vh;padding-bottom:96px;font-family:'DM Sans',sans-serif}
    .page-wrap{width:100%;max-width:760px;margin:0 auto;padding-bottom:100px;background:transparent}

    /* topbar */
    .topbar-premium{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 18px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--xf-line)}
    .topbar-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;color:var(--xf-text);letter-spacing:-.01em}
    .back-btn-premium{width:40px;height:40px;border-radius:12px;background:var(--xf-surface-2);border:1px solid var(--xf-line);
      display:flex;align-items:center;justify-content:center;color:var(--xf-text);text-decoration:none;font-size:20px;font-weight:700;transition:transform .18s var(--xf-ease),background .18s,border-color .18s}
    .back-btn-premium:hover{background:var(--xf-pink-soft);border-color:var(--xf-accent-2);transform:translateX(-2px)}
    .clear-btn{background:none;border:0;color:var(--xf-danger);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:8px 4px;transition:opacity .2s}
    .clear-btn:hover{opacity:.75}

    /* list */
    .notif-list{padding:16px}
    .notif-item{position:relative;background:var(--xf-surface);border:1px solid var(--xf-line);border-radius:18px;
      padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--xf-shadow-sm);
      transition:transform .18s var(--xf-ease),box-shadow .18s,border-color .18s}
    .notif-item:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(208,21,99,.3);border-color:var(--xf-accent-2)}
    .notif-item.unread{background:linear-gradient(135deg,#fff1f7,#fffbe6);border-color:#ffc2cf;border-left:4px solid var(--xf-accent)}
    .notif-item.unread::after{content:"NEW";position:absolute;top:12px;right:12px;font-size:8.5px;font-weight:800;letter-spacing:.08em;
      color:#5a3d00;background:var(--xf-lemon);border-radius:99px;padding:3px 8px;box-shadow:0 0 0 3px rgba(255,226,61,.25);animation:nfPulse 1.8s var(--xf-ease) infinite}
    @keyframes nfPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,226,61,.25)}50%{box-shadow:0 0 0 6px rgba(255,226,61,.08)}}

    .notif-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
      background:var(--xf-surface-2);color:var(--xf-muted)}
    .notif-item.unread .notif-icon{background:var(--xf-hero);color:#fff;box-shadow:0 8px 18px -8px rgba(138,14,66,.5)}
    .notif-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .notif-content{flex:1;min-width:0;padding-right:30px}
    .notif-item:not(.unread) .notif-content{padding-right:0}
    .notif-title{font-size:14px;font-weight:800;color:var(--xf-text);margin-bottom:4px;letter-spacing:-.01em}
    .notif-msg{font-size:13px;color:var(--xf-mid);line-height:1.55;margin-bottom:7px}
    .notif-time{font-size:11px;color:var(--xf-ph);font-weight:700;letter-spacing:.02em}

    /* empty (JS-injected) */
    .empty-state{text-align:center;padding:64px 20px;color:var(--xf-muted)}
    .empty-state-icon{width:72px;height:72px;margin:0 auto 18px;background:var(--xf-pink-soft);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .empty-state-icon svg{width:34px;height:34px;stroke:var(--xf-accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .empty-state p{font-size:14px;font-weight:600}

    /* initial loader (replaced by JS) */
    .loader{width:30px;height:30px;border:3px solid var(--xf-pink-soft);border-top-color:var(--xf-accent);border-right-color:var(--xf-accent-2);border-radius:50%;animation:xfSpin .8s linear infinite}

    /* bottom nav */
    .bottom-nav-premium{position:fixed;bottom:0;left:0;right:0;z-index:100;display:grid;grid-template-columns:repeat(5,1fr);
      background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--xf-line);
      box-shadow:0 -6px 22px -10px rgba(208,21,99,.18);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
    .nav-item-premium{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border:0;background:none;cursor:pointer;
      color:var(--xf-muted);font-size:10.5px;font-weight:700;font-family:inherit;transition:color .18s,transform .18s var(--xf-ease)}
    .nav-item-premium:hover{transform:translateY(-2px)}
    .nav-item-premium.active{color:var(--xf-accent)}
    .nav-icon-premium{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .nav-icon-premium svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    #toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--xf-text);color:#fff;
      padding:13px 22px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;z-index:300;
      box-shadow:0 14px 30px -10px rgba(43,35,48,.5);transition:opacity .28s ease,transform .28s var(--xf-ease);max-width:calc(100% - 32px);text-align:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes xfSpin{to{transform:rotate(360deg)}}
    @keyframes xfUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page-wrap>*{animation:xfUp .5s var(--xf-ease) both}
    .topbar-premium{animation:none}
    @media(min-width:820px){body{padding:24px 18px 40px}.page-wrap{padding:0 0 24px;border:1px solid var(--xf-line);border-radius:30px;background:var(--xf-surface);box-shadow:0 24px 60px -24px rgba(208,21,99,.22);overflow:hidden}.topbar-premium{border-radius:0}.bottom-nav-premium{display:none}body{padding-bottom:40px}}
    @media(max-width:380px){.notif-list{padding:12px}.notif-item{padding:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <header class="topbar-premium">
    <a class="back-btn-premium" href="dashboard.html" aria-label="Back to dashboard">‹</a>
    <span class="topbar-title">Notifications</span>
    <button class="clear-btn" onclick="markAll()">Clear All</button>
  </header>

  <div class="notif-list" id="notifList">
    <div style="padding:40px 20px;display:flex;justify-content:center">
      <div class="loader"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav-premium" aria-label="Primary">
  <button class="nav-item-premium" onclick="location.href='dashboard.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><span>Home</span></button>
  <button class="nav-item-premium" onclick="location.href='products.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div><span>Plans</span></button>
  <button class="nav-item-premium" onclick="location.href='team.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><span>Team</span></button>
  <button class="nav-item-premium active" onclick="location.href='notifications.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><span>Alerts</span></button>
  <button class="nav-item-premium" onclick="location.href='profile.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span>Profile</span></button>
</nav>
<div id="toast"></div>

<!-- ===== SCRIPT BLOCK: VERBATIM. Do not edit. ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){
  var uid="";
  function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
  
  waitSb(async function(){
    var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
    uid=s.user.id; 
    await load();
  });

  async function load(){
    var {data}=await window.sb.from("notifications").select("*").eq("user_id",uid).order("created_at",{ascending:false}).limit(50);
    var el=document.getElementById("notifList");
    
    if(!data||!data.length){ 
      el.innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>'; 
      return; 
    }
    
    el.innerHTML=data.map(function(n){
      var iconSvg = n.title.toLowerCase().includes('credit') || n.title.toLowerCase().includes('success') 
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        
      return '<div class="notif-item'+(n.is_read?'':' unread')+'">'+
        '<div class="notif-icon">'+iconSvg+'</div>'+
        '<div class="notif-content">'+
          '<div class="notif-title">'+n.title+'</div>'+
          '<div class="notif-msg">'+n.message+'</div>'+
          '<div class="notif-time">'+window.SerlzoAuth.timeAgo(n.created_at)+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    
    // Mark all read
    await window.sb.from("notifications").update({is_read:true}).eq("user_id",uid).eq("is_read",false);
  }

  window.markAll=async function(){
    await window.sb.from("notifications").delete().eq("user_id",uid);
    window.SerlzoAuth.toast("All alerts cleared");
    document.getElementById("notifList").innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>';
  };
})();
</script>
</body>
</html>
