<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Offer Code</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    body{
      padding-bottom:calc(30px + env(safe-area-inset-bottom)) !important;
    }

    .page-wrap{
      padding-bottom:30px !important;
    }

    .topbar-premium{
      animation:none !important;
    }

    .gift-hero{
      text-align:center;
    }

    .gift-icon{
      width:74px;
      height:74px;
      margin:0 auto 14px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.28);
      color:#fff;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 12px 24px -12px rgba(0,0,0,.35);
    }

    .gift-icon svg{
      width:34px;
      height:34px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .gift-title{
      font-family:'Sora',sans-serif;
      font-size:1.35rem;
      font-weight:800;
      color:#fff;
      letter-spacing:-.02em;
    }

    .gift-sub{
      margin-top:7px;
      font-size:13px;
      line-height:1.55;
      color:rgba(255,255,255,.9);
      font-weight:600;
    }

    .gift-input{
      margin:16px;
    }

    #giftAlert.alert{
      margin:14px 16px 0;
    }

    .gc-panel{
      margin-top:18px;
    }

    #redemptions{
      padding:6px 14px !important;
    }

    #redemptions .list-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 4px;
      background:transparent !important;
      border:0 !important;
      border-bottom:1px solid var(--rp-line) !important;
    }

    #redemptions .list-item:last-child{
      border-bottom:0 !important;
    }

    #redemptions .li-left{
      min-width:0;
      flex:1;
    }

    #redemptions .li-title{
      font-size:14px;
      font-weight:800;
      color:var(--rp-primary);
      letter-spacing:.08em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #redemptions .li-sub{
      font-size:11.5px;
      color:var(--rp-muted);
      margin-top:3px;
      font-weight:600;
    }

    #redemptions .li-right{
      text-align:right;
      flex:0 0 auto;
    }

    #redemptions .li-amount{
      font-size:15px;
      font-weight:800;
    }

    #redemptions .li-amount.credit{
      color:var(--rp-success) !important;
    }

    #redemptions .empty{
      padding:26px 14px;
      text-align:center;
      color:var(--rp-muted);
      font-size:13px;
      font-weight:600;
    }

    #toast{
      bottom:calc(28px + env(safe-area-inset-bottom)) !important;
    }

    @media (max-width:380px){
      .gift-hero,
      .gift-input,
      #giftAlert,
      .gc-panel{
        margin-inline:12px;
      }

      .gift-input{
        flex-direction:column;
      }

      .gift-input button{
        width:100%;
      }
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <a class="back-btn-premium" href="profile.html" aria-label="Back to profile">‹</a>
      <div class="topbar-title">Offer Code</div>
      <div class="rp-spacer"></div>
    </header>

    <section class="rp-hero gift-hero">
      <div class="gift-icon g-icon" data-icon="gift" aria-hidden="true"></div>
      <div class="gift-title">Redeem an offer code</div>
      <p class="gift-sub">Enter your code below to receive your bonus instantly.</p>
    </section>

    <div class="gift-input">
      <input type="text" id="codeInput" placeholder="ENTER CODE" maxlength="20" oninput="this.value=this.value.toUpperCase()" />
      <button type="button" onclick="redeem()">Redeem</button>
    </div>

    <div id="giftAlert" class="alert"></div>

    <section class="rp-panel gc-panel">
      <div class="section-label" style="margin-bottom:10px;">
        <span class="bar rp-bar"></span>
        <span>My Redemptions</span>
      </div>

      <div class="card" id="redemptions">
        <div class="loader-wrap"><div class="loader"></div></div>
      </div>
    </section>

    <div style="height:20px"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/icons.js" defer></script>

  <script>
  (function(){
    var uid="";
    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
    waitSb(async function(){
      var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
      uid=s.user.id;
      var {data:r}=await window.sb.from("gift_code_redemptions").select("*,gift_codes(code)").eq("user_id",uid).order("created_at",{ascending:false});
      var el=document.getElementById("redemptions");
      if(!r||!r.length){ el.innerHTML='<div class="empty"><p>No gift codes redeemed yet.</p></div>'; return; }
      el.innerHTML=r.map(function(x){
        return '<div class="list-item"><div class="li-left"><div class="li-title">'+x.gift_codes?.code+'</div><div class="li-sub">'+window.SerlzoAuth.timeAgo(x.created_at)+'</div></div>'+
          '<div class="li-right"><div class="li-amount credit">+'+window.SerlzoAuth.money(x.amount)+'</div></div></div>';
      }).join("");
    });

    window.redeem=async function(){
      var code=document.getElementById("codeInput").value.trim();
      var al=document.getElementById("giftAlert");
      if(!code){ al.textContent="Enter a gift code"; al.className="alert alert-error show"; return; }
      al.className="alert";
      var r=await fetch("/api/bonus?action=redeem-gift",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,code})});
      var d=await r.json();
      if(d.ok){
        al.textContent="Redeemed! "+window.SerlzoAuth.money(d.amount)+" added to your Redpay account.";
        al.className="alert alert-success show";
        document.getElementById("codeInput").value="";
      } else {
        al.textContent=d.error||"Invalid code";
        al.className="alert alert-error show";
      }
    };
  })();
  </script>
</body>
</html>
