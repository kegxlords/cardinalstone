<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Offer Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    /* ===== XFusion Offer Code shell. premium-pages loads BEFORE this block so page paint wins the !important collisions (.gift-hero, .list-item). JS-injected ids/classes preserved. ===== */
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --xf-bg:#fff8fb;--xf-surface:#ffffff;--xf-surface-2:#fdf3f8;--xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330;--xf-mid:#4a3f52;--xf-muted:#6f6478;--xf-ph:#b8aec0;--xf-ink:#2b2330;
      --xf-accent:#d01563;--xf-accent-2:#ff3d8b;--xf-pink-soft:#ffe3ef;--xf-lemon:#ffe23d;--xf-yellow:#ffc93c;--xf-hero-dark:#8a0e42;--xf-success:#16a34a;--xf-danger:#e11d48;
      --xf-sweep:linear-gradient(135deg,#ff3d8b 0%,#ffc93c 55%,#ffe23d 100%);
      --xf-hero:linear-gradient(135deg,#8a0e42 0%,#d01563 50%,#ff3d8b 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
      --xf-shadow-sm:0 8px 20px -12px rgba(208,21,99,.22);
    }
    body{background:radial-gradient(circle at 0% 0%,rgba(255,61,139,.06),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(255,226,61,.10),transparent 34rem),var(--xf-bg)!important;color:var(--xf-text)!important}
    .page-wrap{padding-bottom:30px}
    .topbar{background:rgba(255,255,255,.86)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .topbar-title{font-family:'Playfair Display',serif!important;letter-spacing:-.01em}

    /* gift hero */
    .gift-hero{position:relative;overflow:hidden;margin:16px;padding:34px 22px 30px;text-align:center;color:#fff!important;
      border-radius:26px;background:var(--xf-hero)!important;box-shadow:0 22px 48px -20px rgba(138,14,66,.6)!important;border:1px solid rgba(255,255,255,.12)}
    .gift-hero::before{content:'';position:absolute;top:-90px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,61,.4),transparent 68%)}
    .gift-hero::after{content:'';position:absolute;bottom:-110px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
    .gh-inner{position:relative;z-index:1}
    .gift-icon{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(6px);
      box-shadow:0 10px 24px -10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
    .gift-icon svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .gift-hero .gh-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:800;letter-spacing:-.01em}
    .gift-hero .gh-sub{font-size:13.5px;opacity:.9;margin-top:7px;font-weight:500;line-height:1.5}

    /* redeem input group */
    .gift-input{display:flex;gap:10px;margin:18px 16px 0}
    .gift-input input{flex:1;min-width:0;min-height:54px;padding:0 16px;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.14em;
      text-transform:uppercase;color:var(--xf-text);background:var(--xf-surface);border:1.5px solid var(--xf-line);border-radius:15px;outline:none;
      transition:border-color .18s,box-shadow .18s,background .18s}
    .gift-input input::placeholder{color:var(--xf-ph);font-weight:700;letter-spacing:.1em}
    .gift-input input:focus{border-color:var(--xf-accent-2);box-shadow:0 0 0 4px rgba(255,61,139,.16)}
    .gift-input button{flex:0 0 auto;min-height:54px;padding:0 22px;border:0;border-radius:15px;cursor:pointer;font-family:inherit;
      font-size:15px;font-weight:800;color:var(--xf-ink);background:var(--xf-sweep);box-shadow:0 12px 26px -10px rgba(208,21,99,.45);
      transition:transform .18s var(--xf-ease),box-shadow .18s}
    .gift-input button:hover{transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(208,21,99,.55)}
    .gift-input button:active{transform:scale(.98)}

    /* alert (JS toggles .alert .alert-error/.alert-success .show) */
    #giftAlert.alert{display:none;margin:14px 16px 0;padding:13px 15px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.45}
    #giftAlert.alert.show{display:block;animation:xfUp .3s var(--xf-ease) both}
    #giftAlert.alert-error{background:#ffe4e9!important;color:#9f1239!important;border:1px solid #ffc2cf!important}
    #giftAlert.alert-success{background:#f0fdf4!important;color:#15803d!important;border:1px solid #bbf7d0!important}

    /* redemptions */
    .section{margin:22px 16px 0}
    .gc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .gc-head .bar{width:4px;height:15px;border-radius:3px;background:var(--xf-sweep)}
    .gc-head h3{font-size:13px!important;font-weight:800!important;color:var(--xf-muted)!important;margin:0!important;letter-spacing:.08em;text-transform:uppercase}
    .card#redemptions{background:var(--xf-surface)!important;border:1px solid var(--xf-line)!important;border-radius:20px!important;box-shadow:var(--xf-shadow-sm)!important;padding:6px 14px!important;overflow:hidden}
    /* JS-injected rows — recolor the premium-forced .list-item */
    #redemptions .list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;
      background:transparent!important;border:0!important;border-bottom:1px solid var(--xf-line)!important}
    #redemptions .list-item:last-child{border-bottom:0!important}
    #redemptions .li-left{min-width:0;flex:1}
    #redemptions .li-title{font-size:14px;font-weight:800;color:var(--xf-accent);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #redemptions .li-sub{font-size:11.5px;color:var(--xf-muted);margin-top:3px;font-weight:600}
    #redemptions .li-right{text-align:right;flex:0 0 auto}
    #redemptions .li-amount{font-size:15px;font-weight:800}
    #redemptions .li-amount.credit{color:var(--xf-success)!important}
    #redemptions .empty{padding:26px 14px;text-align:center;color:var(--xf-muted);font-size:13px;font-weight:600}
    .loader-wrap{padding:26px;display:flex;justify-content:center}
    .loader{width:28px;height:28px;border:3px solid var(--xf-pink-soft);border-top-color:var(--xf-accent);border-right-color:var(--xf-accent-2);border-radius:50%;animation:xfSpin .8s linear infinite}

    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--xf-text);color:#fff;
      padding:13px 22px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;z-index:300;
      box-shadow:0 14px 30px -10px rgba(43,35,48,.5);transition:opacity .28s ease,transform .28s var(--xf-ease);max-width:calc(100% - 32px);text-align:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes xfSpin{to{transform:rotate(360deg)}}
    @keyframes xfUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page-wrap>*{animation:xfUp .5s var(--xf-ease) both}
    .topbar{animation:none}
    @media(min-width:820px){.page-wrap{max-width:560px}}
    @media(max-width:380px){.gift-hero,.gift-input,#giftAlert,.section{margin-inline:12px}.gift-input{flex-direction:column}.gift-input button{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <div class="topbar"><a class="back-btn" href="profile.html">‹</a><span class="topbar-title">Offer Code</span><div></div></div>

  <section class="gift-hero">
    <div class="gh-inner">
      <div class="gift-icon g-icon" data-icon="gift" aria-hidden="true"></div>
      <div class="gh-title">Redeem an offer code</div>
      <div class="gh-sub">Enter your code below to receive your bonus instantly.</div>
    </div>
  </section>

  <div class="gift-input">
    <input type="text" id="codeInput" placeholder="ENTER CODE" maxlength="20" oninput="this.value=this.value.toUpperCase()"/>
    <button onclick="redeem()">Redeem</button>
  </div>
  <div id="giftAlert" class="alert"></div>

  <div class="section">
    <div class="gc-head"><span class="bar"></span><h3>My Redemptions</h3></div>
    <div class="card" id="redemptions"><div class="loader-wrap"><div class="loader"></div></div></div>
  </div>
</div>
<div id="toast"></div>

<!-- ===== SCRIPT BLOCK: VERBATIM except ONE flagged brand word ("Serlzo Investments" -> "XFusion") in the success message. 5 tags incl. icons.js preserved. ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){
  var uid="";
  function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
  waitSb(async function(){
    var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
    uid=s.user.id;
    var {data:r}=await window.sb.from("gift_code_redemptions").select("*,gift_codes(code)").eq("user_id",uid).order("created_at",{ascending:false});
    var el=document.getElementById("redemptions");
    if(!r||!r.length){ el.innerHTML='<div class="empty"><p>No gift codes redeemed yet.</p></div>'; return; }
    el.innerHTML=r.map(function(x){
      return '<div class="list-item"><div class="li-left"><div class="li-title">'+x.gift_codes?.code+'</div><div class="li-sub">'+window.SerlzoAuth.timeAgo(x.created_at)+'</div></div>'+
        '<div class="li-right"><div class="li-amount credit">+'+window.SerlzoAuth.money(x.amount)+'</div></div></div>';
    }).join("");
  });

  window.redeem=async function(){
    var code=document.getElementById("codeInput").value.trim();
    var al=document.getElementById("giftAlert");
    if(!code){ al.textContent="Enter a gift code"; al.className="alert alert-error show"; return; }
    al.className="alert";
    var r=await fetch("/api/bonus?action=redeem-gift",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,code})});
    var d=await r.json();
    if(d.ok){
      al.textContent="Redeemed! "+window.SerlzoAuth.money(d.amount)+" added to your XFusion account.";
      al.className="alert alert-success show";
      document.getElementById("codeInput").value="";
    } else {
      al.textContent=d.error||"Invalid code";
      al.className="alert alert-error show";
    }
  };
})();
</script>
</body>
</html>
