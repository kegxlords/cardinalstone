<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Daily Check-In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    body{
      padding-bottom:calc(30px + env(safe-area-inset-bottom)) !important;
    }

    .page-wrap{
      padding-bottom:30px !important;
    }

    .topbar-premium{
      animation:none !important;
    }

    .checkin-card{
      text-align:center;
    }

    .ck-watermark{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Sora',sans-serif;
      font-size:180px;
      font-weight:800;
      color:rgba(255,255,255,.05);
      line-height:1;
      pointer-events:none;
      user-select:none;
    }

    .ck-inner{
      position:relative;
      z-index:1;
    }

    .checkin-label{
      max-width:320px;
      margin-left:auto;
      margin-right:auto;
    }

    .rc-panel{
      margin-top:18px;
    }

    #checkinActivity > div:last-child{
      border-bottom:0 !important;
    }

    #checkinActivity > div{
      transition:background .15s ease;
    }

    #checkinActivity > div:hover{
      background:var(--rp-surface-2);
      border-radius:10px;
    }

    #toast{
      bottom:calc(28px + env(safe-area-inset-bottom)) !important;
    }

    @media (max-width:380px){
      .checkin-card,
      .rc-panel{
        margin-inline:12px;
      }

      .streak-day{
        height:38px;
        font-size:9px;
      }
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <a class="back-btn-premium" href="profile.html" aria-label="Back to profile">‹</a>
      <div class="topbar-title">Daily Check-In</div>
      <div class="rp-spacer"></div>
    </header>

    <section class="checkin-card rp-hero">
      <div class="ck-watermark" aria-hidden="true">%</div>
      <div class="ck-inner">
        <div class="checkin-icon g-icon" id="checkinIcon" data-icon="calendar" aria-hidden="true"></div>
        <div class="checkin-amount" id="checkinAmount">₦50</div>
        <div class="checkin-label">Daily bonus — claim every day to keep your streak alive.</div>
        <button class="checkin-btn" type="button" id="checkinBtn" onclick="doCheckin()">Claim ₦50 Bonus</button>
        <div class="streak-row" id="streakRow"></div>
      </div>
    </section>

    <section class="rp-panel rc-panel">
      <div class="section-label" style="margin-bottom:12px;">
        <span class="bar rp-bar"></span>
        <span>Recent Check-Ins</span>
      </div>

      <div id="checkinActivity">
        <div class="loader-wrap"><div class="loader"></div></div>
      </div>
    </section>

    <div style="height:20px"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/icons.js" defer></script>

  <script>
  (function(){
    var uid="";
    var DAILY_BONUS=50;
    function formatNaira(amount){return "₦"+Number(amount||0).toLocaleString("en-NG");}
    function setBonusLabels(amount){
      DAILY_BONUS=Number(amount)>0?Number(amount):50;
      document.getElementById("checkinAmount").textContent=formatNaira(DAILY_BONUS);
      var btn=document.getElementById("checkinBtn");
      if(!btn.disabled) btn.textContent="Claim "+formatNaira(DAILY_BONUS)+" Bonus";
    }
    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
    waitSb(async function(){
      var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
      uid=s.user.id;

      var r=await fetch("/api/bonus?action=checkin-status&user_id="+uid);
      var d=await r.json();
      setBonusLabels(d.bonus_amount);
      var btn=document.getElementById("checkinBtn");
      if(d.claimed){
        btn.textContent="Already Claimed Today"; btn.disabled=true;
        document.getElementById("checkinIcon").textContent="";
        if(window.SerlzoIcons) window.SerlzoIcons.render();
      }

      // Last 7 days streak
      var {data:hist}=await window.sb.from("daily_checkins").select("date,amount").eq("user_id",uid).order("date",{ascending:false}).limit(30);
      var claimedDates=new Set((hist||[]).map(function(x){return x.date;}));
      var streakEl=document.getElementById("streakRow");
      var days=["Su","Mo","Tu","We","Th","Fr","Sa"];
      for(var i=6;i>=0;i--){
        var dt=new Date(); dt.setDate(dt.getDate()-i);
        var ds=dt.toISOString().slice(0,10);
        var isToday=i===0;
        var done=claimedDates.has(ds);
        var div=document.createElement("div");
        div.className="streak-day"+(isToday?" today":done?" done":"");
        div.textContent=done||isToday?"Done":days[dt.getDay()];
        streakEl.appendChild(div);
      }

      var histEl=document.getElementById("checkinActivity");
      if(!hist||!hist.length){
        histEl.innerHTML='<div style="text-align:center;color:var(--muted);font-size:13px;padding:12px">No check-ins yet.</div>';
      } else {
        histEl.innerHTML=hist.slice(0,7).map(function(c){
          return '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">'+
            '<span style="font-size:13px;color:var(--text2)">'+new Date(c.date).toDateString()+'</span>'+
            '<span style="font-size:13px;font-weight:700;color:var(--success)">+'+formatNaira(c.amount || DAILY_BONUS)+'</span>'+
          '</div>';
        }).join("");
      }
    });

    window.doCheckin=async function(){
      var btn=document.getElementById("checkinBtn");
      btn.disabled=true; btn.textContent="Claiming…";
      var r=await fetch("/api/bonus?action=daily-checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid})});
      var d=await r.json();
      if(d.ok){
        var creditedAmount=Number(d.amount)||DAILY_BONUS;
        window.SerlzoAuth.toast("Claimed "+formatNaira(creditedAmount)+" daily bonus!");
        btn.textContent="Claimed!";
        document.getElementById("checkinIcon").textContent="";
        if(window.SerlzoIcons) window.SerlzoIcons.render();
      } else {
        window.SerlzoAuth.toast(d.error==="already_claimed"?"Already claimed today!":d.error||"Error");
        btn.disabled=false; btn.textContent="Claim "+formatNaira(DAILY_BONUS)+" Bonus";
      }
    };
  })();
  </script>
</body>
</html>
