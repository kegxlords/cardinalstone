<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Daily Check-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    /* ===== XFusion Daily Check-In shell. JS-injected ids/classes preserved; only paint + structure are new. ===== */
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --xf-bg:#fff8fb;--xf-surface:#ffffff;--xf-surface-2:#fdf3f8;--xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330;--xf-mid:#4a3f52;--xf-muted:#6f6478;--xf-ph:#b8aec0;--xf-ink:#2b2330;
      --xf-accent:#d01563;--xf-accent-2:#ff3d8b;--xf-pink-soft:#ffe3ef;--xf-lemon:#ffe23d;--xf-yellow:#ffc93c;--xf-hero-dark:#8a0e42;--xf-success:#16a34a;
      --xf-sweep:linear-gradient(135deg,#ff3d8b 0%,#ffc93c 55%,#ffe23d 100%);
      --xf-hero:linear-gradient(135deg,#8a0e42 0%,#d01563 50%,#ff3d8b 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
      --xf-shadow-sm:0 8px 20px -12px rgba(208,21,99,.22);
    }
    body{background:radial-gradient(circle at 0% 0%,rgba(255,61,139,.06),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(255,226,61,.10),transparent 34rem),var(--xf-bg)!important;color:var(--xf-text)!important}
    .page-wrap{padding-bottom:30px}
    .topbar{background:rgba(255,255,255,.86)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .topbar-title{font-family:'Playfair Display',serif!important;letter-spacing:-.01em}

    /* ---- check-in hero card ---- */
    .checkin-card{
      position:relative;overflow:hidden;margin:16px;padding:30px 22px 26px;text-align:center;color:#fff;
      border-radius:26px;background:var(--xf-hero);
      box-shadow:0 22px 48px -20px rgba(138,14,66,.6)!important;
      border:1px solid rgba(255,255,255,.12);
    }
    .checkin-card::before{content:'';position:absolute;top:-90px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,61,.4),transparent 68%)}
    .checkin-card::after{content:'';position:absolute;bottom:-110px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
    .ck-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:180px;font-weight:800;color:rgba(255,255,255,.05);line-height:1;pointer-events:none;user-select:none}
    .ck-inner{position:relative;z-index:1}

    .checkin-icon{
      width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
      box-shadow:0 10px 24px -10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);
      color:#fff;backdrop-filter:blur(6px);
    }
    .checkin-icon svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .checkin-amount{font-size:clamp(40px,12vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.25)}
    .checkin-label{font-size:13.5px;opacity:.9;margin-top:8px;font-weight:600;letter-spacing:.01em}

    .checkin-btn{
      position:relative;overflow:hidden;width:100%;margin-top:22px;min-height:56px;border:0;border-radius:50px;cursor:pointer;
      font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.01em;color:var(--xf-accent);
      background:#fff;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);
      transition:transform .18s var(--xf-ease),box-shadow .18s,opacity .15s;
    }
    .checkin-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,61,139,.18) 50%,transparent 68%);transform:translateX(-120%);transition:transform .6s}
    .checkin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(0,0,0,.45)}
    .checkin-btn:hover:not(:disabled)::after{transform:translateX(120%)}
    .checkin-btn:active:not(:disabled){transform:scale(.98)}
    .checkin-btn:disabled{cursor:default;background:var(--xf-lemon);color:#5a3d00;box-shadow:0 10px 24px -12px rgba(90,61,0,.5)}

    /* ---- streak track ---- */
    .streak-row{display:flex;gap:7px;justify-content:center;margin-top:20px;flex-wrap:nowrap;position:relative;z-index:1}
    .streak-day{
      flex:1 1 0;min-width:0;max-width:46px;height:42px;border-radius:12px;
      border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:800;letter-spacing:.02em;color:rgba(255,255,255,.62);
      transition:transform .18s var(--xf-ease);
    }
    .streak-day.done{background:rgba(255,255,255,.92);color:var(--xf-accent);border-color:transparent;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}
    .streak-day.today{background:var(--xf-lemon);color:#5a3d00;border-color:#fff;box-shadow:0 0 0 3px rgba(255,226,61,.35);animation:ckPulse 1.8s var(--xf-ease) infinite}
    @keyframes ckPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,226,61,.30)}50%{box-shadow:0 0 0 6px rgba(255,226,61,.12)}}

    /* ---- recent panel ---- */
    .section{margin:18px 16px}
    .card.card-pad{background:var(--xf-surface)!important;border:1px solid var(--xf-line)!important;border-radius:22px!important;box-shadow:var(--xf-shadow-sm)!important;padding:20px!important}
    .rc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .rc-head .bar{width:4px;height:15px;border-radius:3px;background:var(--xf-sweep)}
    .rc-head h3{font-size:14px!important;font-weight:800!important;color:var(--xf-text)!important;margin:0!important;letter-spacing:-.01em}
    /* tidy the JS-injected history rows (CSS only) */
    #checkinActivity > div:last-child{border-bottom:0!important}
    #checkinActivity > div{transition:background .15s}
    #checkinActivity > div:hover{background:var(--xf-surface-2);border-radius:10px}

    @keyframes xfUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page-wrap>*{animation:xfUp .5s var(--xf-ease) both}
    .topbar{animation:none}
    @media(min-width:820px){.page-wrap{max-width:560px}}
    @media(max-width:380px){.checkin-card,.section{margin-inline:12px}.streak-day{height:38px;font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <div class="topbar">
    <a class="back-btn" href="profile.html">‹</a>
    <span class="topbar-title">Daily Check-In</span>
    <div></div>
  </div>

  <section class="checkin-card">
    <div class="ck-watermark" aria-hidden="true">%</div>
    <div class="ck-inner">
      <div class="checkin-icon g-icon" id="checkinIcon" data-icon="calendar" aria-hidden="true"></div>
      <div class="checkin-amount" id="checkinAmount">₦50</div>
      <div class="checkin-label">Daily bonus — claim every day to keep your streak alive.</div>
      <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">Claim ₦50 Bonus</button>
      <div class="streak-row" id="streakRow"></div>
    </div>
  </section>

  <div class="section">
    <div class="card card-pad">
      <div class="rc-head"><span class="bar"></span><h3>Recent Check-Ins</h3></div>
      <div id="checkinActivity"><div class="loader-wrap"><div class="loader"></div></div></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<!-- ===== SCRIPT BLOCK: VERBATIM. Do not edit. ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){
  var uid="";
  var DAILY_BONUS=50;
  function formatNaira(amount){return "₦"+Number(amount||0).toLocaleString("en-NG");}
  function setBonusLabels(amount){
    DAILY_BONUS=Number(amount)>0?Number(amount):50;
    document.getElementById("checkinAmount").textContent=formatNaira(DAILY_BONUS);
    var btn=document.getElementById("checkinBtn");
    if(!btn.disabled) btn.textContent="Claim "+formatNaira(DAILY_BONUS)+" Bonus";
  }
  function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
  waitSb(async function(){
    var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
    uid=s.user.id;

    var r=await fetch("/api/bonus?action=checkin-status&user_id="+uid);
    var d=await r.json();
    setBonusLabels(d.bonus_amount);
    var btn=document.getElementById("checkinBtn");
    if(d.claimed){
      btn.textContent="Already Claimed Today"; btn.disabled=true;
      document.getElementById("checkinIcon").textContent="";
      if(window.SerlzoIcons) window.SerlzoIcons.render();
    }

    // Last 7 days streak
    var {data:hist}=await window.sb.from("daily_checkins").select("date,amount").eq("user_id",uid).order("date",{ascending:false}).limit(30);
    var claimedDates=new Set((hist||[]).map(function(x){return x.date;}));
    var streakEl=document.getElementById("streakRow");
    var days=["Su","Mo","Tu","We","Th","Fr","Sa"];
    for(var i=6;i>=0;i--){
      var dt=new Date(); dt.setDate(dt.getDate()-i);
      var ds=dt.toISOString().slice(0,10);
      var isToday=i===0;
      var done=claimedDates.has(ds);
      var div=document.createElement("div");
      div.className="streak-day"+(isToday?" today":done?" done":"");
      div.textContent=done||isToday?"Done":days[dt.getDay()];
      streakEl.appendChild(div);
    }

    var histEl=document.getElementById("checkinActivity");
    if(!hist||!hist.length){
      histEl.innerHTML='<div style="text-align:center;color:var(--muted);font-size:13px;padding:12px">No check-ins yet.</div>';
    } else {
      histEl.innerHTML=hist.slice(0,7).map(function(c){
        return '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">'+
          '<span style="font-size:13px;color:var(--text2)">'+new Date(c.date).toDateString()+'</span>'+
          '<span style="font-size:13px;font-weight:700;color:var(--success)">+'+formatNaira(c.amount || DAILY_BONUS)+'</span>'+
        '</div>';
      }).join("");
    }
  });

  window.doCheckin=async function(){
    var btn=document.getElementById("checkinBtn");
    btn.disabled=true; btn.textContent="Claiming…";
    var r=await fetch("/api/bonus?action=daily-checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid})});
    var d=await r.json();
    if(d.ok){
      var creditedAmount=Number(d.amount)||DAILY_BONUS;
      window.SerlzoAuth.toast("Claimed "+formatNaira(creditedAmount)+" daily bonus!");
      btn.textContent="Claimed!";
      document.getElementById("checkinIcon").textContent="";
      if(window.SerlzoIcons) window.SerlzoIcons.render();
    } else {
      window.SerlzoAuth.toast(d.error==="already_claimed"?"Already claimed today!":d.error||"Error");
      btn.disabled=false; btn.textContent="Claim "+formatNaira(DAILY_BONUS)+" Bonus";
    }
  };
})();
</script>
</body>
</html>
