<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />
</head>
<body class="rp-auth-body">

  <main class="rp-auth-card">
    <aside class="rp-auth-brand">
      <div class="rp-auth-brand-inner">
        <div class="rp-brand">
          <span class="rp-diamond"></span>
          <span class="rp-word">Redpay</span>
        </div>
        <p class="rp-auth-tag">Create your account in under a minute</p>
      </div>
    </aside>

    <section class="rp-auth-panel">
      <p class="rp-eyebrow">Get started</p>
      <h1 class="rp-h">Create your account</h1>
      <p class="rp-sub">Join Redpay and start building daily income today.</p>

      <div id="refBox" class="ref-box">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Referred by: <b id="refName">a friend</b>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <div class="rp-fields">
        <div class="rp-field">
          <label for="fullName">Full name</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="rp-input" type="text" id="fullName" placeholder="Your full name" autocomplete="name" />
          </div>
        </div>

        <div class="rp-field">
          <label for="email">Email address</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input class="rp-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="rp-field">
          <label for="phone">Phone number</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
            <input class="rp-input" type="tel" id="phone" placeholder="080XXXXXXXX" autocomplete="tel" />
          </div>
        </div>

        <div class="rp-field">
          <label for="password">Password</label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input class="rp-input" type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
          </div>
        </div>

        <div class="rp-field">
          <label for="refCode">Referral code <span style="color:var(--rp-ph);font-weight:700;font-size:.68rem;">(optional)</span></label>
          <div class="rp-input-wrap">
            <svg class="rp-ico" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4a1.2 1.2 0 0 1 1.2-1.2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
            <input class="rp-input" type="text" id="refCode" placeholder="ENTER CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em;" />
          </div>
        </div>
      </div>

      <button class="rp-btn" type="button" id="regBtn">Create Account</button>
      <p class="rp-foot">Already have an account? <a href="index.html">Sign in</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/icons.js" defer></script>
  <script>
(function(){

  /* ── helpers ── */
  function cleanMsg(msg){
    if(!msg) return null;
    var s = String(msg).trim();
    if(s === "{}" || s === "[]" || s === "[object Object]" || s === "undefined") return null;
    try { var p = JSON.parse(s); if(p && p.message) return p.message; } catch(e){}
    return s;
  }

  function showAlert(msg, type){
    var el  = document.getElementById("alertBox");
    var clean = cleanMsg(msg) || (type==="success"
      ? "Success!"
      : "Something went wrong. Make sure the database schema has been set up in Supabase.");
    el.textContent = clean;
    el.className = "alert-box " + (type==="success" ? "alert-success" : "alert-error");
    el.style.display = "block";
  }
  function hideAlert(){
    document.getElementById("alertBox").style.display = "none";
  }

  /* ── pre-fill ref code from URL ─ */
  var urlRef = new URLSearchParams(location.search).get("ref");
  if(urlRef){
    document.getElementById("refCode").value = urlRef.toUpperCase();
    document.getElementById("refBox").style.display = "flex";
  }

  document.getElementById("refCode").addEventListener("input", function(){
    this.value = this.value.toUpperCase();
  });

  /* ── register ── */
  document.getElementById("regBtn").addEventListener("click", async function(){
    var btn   = this;
    var name  = document.getElementById("fullName").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var pass  = document.getElementById("password").value;
    var ref   = document.getElementById("refCode").value.trim().toUpperCase();

    hideAlert();

    if(!name || !email || !phone || !pass){
      showAlert("Please fill in all required fields.", "error"); return;
    }
    if(pass.length < 6){
      showAlert("Password must be at least 6 characters.", "error"); return;
    }

    if(window.SerlzoReady) await window.SerlzoReady;
    if(!window.sb){
      showAlert(window.SerlzoConfig?.error || "Redpay account service is unavailable. Check the deployment configuration and try again.", "error"); return;
    }

    btn.disabled = true; btn.textContent = "Creating account…";

    try {

      if(ref){
        try {
          var {data:refProfile} = await window.sb
            .from("profiles").select("id,full_name")
            .eq("referral_code", ref).single();
          if(refProfile){
            document.getElementById("refName").textContent = refProfile.full_name || "a friend";
            document.getElementById("refBox").style.display = "flex";
          }
        } catch(refLookupError) {
          console.warn("Referral lookup skipped:", refLookupError);
        }
      }

      var {data, error} = await window.sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: {
            full_name: name,
            phone: phone,
            referral_code: ref || null,
          }
        }
      });

      if(error){
        var signupMessage = cleanMsg(error.message || error);
        var signupNetworkFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(signupMessage || ""));
        showAlert(
          signupNetworkFailure
            ? "Unable to reach the account service. The deployed SUPABASE_URL points to an unavailable project."
            : signupMessage || "Registration failed. Try again.",
          "error"
        );
        btn.disabled = false; btn.textContent = "Create Account"; return;
      }

      if(!data?.session){
        showAlert(
          "Account created! Check your email for a confirmation link, then sign in.",
          "success"
        );
        btn.disabled = false; btn.textContent = "Create Account";
        return;
      }

      showAlert("Account created! Signing you in…", "success");

      var {error:loginErr} = await window.sb.auth.signInWithPassword({email, password:pass});
      if(loginErr){
        showAlert("Account created! Please sign in manually.", "success");
        setTimeout(function(){ location.href = "/index.html"; }, 1500);
        return;
      }

      setTimeout(function(){ location.href = "/dashboard.html"; }, 1000);

    } catch(e) {
      console.error("Registration error:", e);
      var rawMessage = cleanMsg(e?.message);
      var isFetchFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(rawMessage || e || ""));
      var errMsg = isFetchFailure
        ? "Unable to reach the account service. Confirm that SUPABASE_URL points to an active Supabase project."
        : rawMessage;
      showAlert(errMsg || "Registration failed. Please check your setup and try again.", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

})();
</script>
    
  <!-- PASTE YOUR EXISTING REGISTER SCRIPT BLOCK HERE -->
  <!-- Only change: "XFusion account service..." -> "Redpay account service..." -->
</body>
</html>
