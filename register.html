<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>

  <style>
    /* ===== XFusion Register Skin (pink · white · yellow · lemon) ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --xf-ink: #2B2330;
      --xf-mid: #4A3F52;
      --xf-muted: #6F6478;
      --xf-placeholder: #B8AEC0;
      --xf-pink: #FF3D8B;
      --xf-pink-deep: #D01563;
      --xf-pink-soft: #FFE3EF;
      --xf-lemon: #FFE23D;
      --xf-yellow: #FFC93C;
      --xf-field-bg: #FFFAFC;
      --xf-field-border: #F3DBE8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #FFF1F7 0%, #FFFBE6 50%, #FFE8F2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft ambient glows — pink + lemon (was blue + green) */
    body::before {
      content: '';
      position: absolute;
      top: -10%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(255, 61, 139, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -10%; right: -10%;
      width: 40vw; height: 40vw;
      background: radial-gradient(circle, rgba(255, 226, 61, 0.16) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 10;
      animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid rgba(255, 61, 139, 0.08);
      border-radius: 28px;
      padding: 40px 32px;
      /* glow -> shadow flip: pink-tinted lift on a light page */
      box-shadow: 0 24px 48px -12px rgba(255, 61, 139, 0.18), 0 0 0 1px rgba(255, 61, 139, 0.05);
    }

    .auth-header { text-align: center; margin-bottom: 32px; }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--xf-ink);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* The fusion mark: pink ⨯ lemon, rotated diamond */
    .logo-dot {
      width: 12px; height: 12px;
      background: linear-gradient(135deg, var(--xf-pink) 0%, var(--xf-lemon) 100%);
      border-radius: 4px;
      transform: rotate(45deg);
      box-shadow: 0 0 0 4px rgba(255, 61, 139, 0.15);
    }

    .logo-sub { font-size: 15px; color: var(--xf-muted); font-weight: 500; }

    .title { font-size: 24px; font-weight: 800; color: var(--xf-ink); margin-bottom: 8px; text-align: center; }
    .sub { font-size: 15px; color: var(--xf-muted); margin-bottom: 28px; text-align: center; line-height: 1.5; }

    /* Referral box — lemon tint (was green) */
    .ref-box {
      background: #FFFBE6;
      border: 1px solid #FFE9A8;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #8A6D00;
      font-weight: 600;
      display: flex;            /* JS reveals with display:flex — keep */
      align-items: center;
      gap: 8px;
    }

    /* Alert boxes — class names preserved exactly for the JS */
    .alert-box {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    .alert-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
    .alert-success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }

    /* Fields */
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 8px; color: var(--xf-mid); font-size: 14px; font-weight: 700; }
    .field input {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      color: var(--xf-ink);
      background: var(--xf-field-bg);
      border: 1.5px solid var(--xf-field-border);
      border-radius: 14px;
      outline: none;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .field input::placeholder { color: var(--xf-placeholder); }
    .field input:focus {
      border-color: var(--xf-pink);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 61, 139, 0.12);
    }

    /* Primary CTA — the fusion sweep, ink text for contrast on both ends */
    .btn {
      width: 100%;
      min-height: 54px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.3px;
      color: var(--xf-ink);
      background: linear-gradient(135deg, var(--xf-pink) 0%, var(--xf-yellow) 55%, var(--xf-lemon) 100%);
      box-shadow: 0 12px 24px -6px rgba(255, 61, 139, 0.40);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 28px -6px rgba(255, 61, 139, 0.50); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Footer switch */
    .switch { text-align: center; font-size: 15px; color: var(--xf-muted); margin-top: 28px; font-weight: 500; }
    .switch a { color: var(--xf-pink-deep); font-weight: 800; text-decoration: none; transition: color 0.2s ease; }
    .switch a:hover { color: #A80F4E; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; border-radius: 24px; }
      .logo { font-size: 26px; }
    }
  </style>
</head>
<body class="register-page">

<div class="wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-dot"></span>
        XFusion
      </div>
      <div class="logo-sub">Create your premium fused-investment account</div>
    </div>

    <div class="title">Join XFusion</div>
    <div class="sub">Where pink meets lemon — and your money starts compounding today.</div>

    <!-- Ref box — hidden by default -->
    <div id="refBox" class="ref-box" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Referred by: <span id="refName">a friend</span>
    </div>

    <!-- Alert box — hidden by default -->
    <div id="alertBox" class="alert-box" style="display:none"></div>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Your full name" autocomplete="name"/>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="080XXXXXXXX" autocomplete="tel"/>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password"/>
    </div>

    <div class="field">
      <label for="refCode">Referral Code <span style="color:var(--xf-placeholder);font-weight:400;font-size:12px;">(optional)</span></label>
      <input type="text" id="refCode" placeholder="ENTER CODE" style="text-transform:uppercase;letter-spacing:.08em" autocomplete="off"/>
    </div>

    <button class="btn" id="regBtn">Create Account</button>

    <div class="switch">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){

  /* ── helpers ─ */
  function cleanMsg(msg){
    if(!msg) return null;
    var s = String(msg).trim();
    if(s === "{}" || s === "[]" || s === "[object Object]" || s === "undefined") return null;
    try { var p = JSON.parse(s); if(p && p.message) return p.message; } catch(e){}
    return s;
  }

  function showAlert(msg, type){
    var el  = document.getElementById("alertBox");
    var clean = cleanMsg(msg) || (type==="success"
      ? "Success!"
      : "Something went wrong. Make sure the database schema has been set up in Supabase.");
    el.textContent = clean;
    el.className = "alert-box " + (type==="success" ? "alert-success" : "alert-error");
    el.style.display = "block";
  }
  function hideAlert(){
    document.getElementById("alertBox").style.display = "none";
  }

  /* ── pre-fill ref code from URL ─ */
  var urlRef = new URLSearchParams(location.search).get("ref");
  if(urlRef){
    document.getElementById("refCode").value = urlRef.toUpperCase();
    document.getElementById("refBox").style.display = "flex";
  }

  document.getElementById("refCode").addEventListener("input", function(){
    this.value = this.value.toUpperCase();
  });

  /* ── register ── */
  document.getElementById("regBtn").addEventListener("click", async function(){
    var btn   = this;
    var name  = document.getElementById("fullName").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var pass  = document.getElementById("password").value;
    var ref   = document.getElementById("refCode").value.trim().toUpperCase();

    hideAlert();

    if(!name || !email || !phone || !pass){
      showAlert("Please fill in all required fields.", "error"); return;
    }
    if(pass.length < 6){
      showAlert("Password must be at least 6 characters.", "error"); return;
    }

    if(window.SerlzoReady) await window.SerlzoReady;
    if(!window.sb){
      showAlert(window.SerlzoConfig?.error || "XFusion account service is unavailable. Check the deployment configuration and try again.", "error"); return;
    }

    btn.disabled = true; btn.textContent = "Creating account…";

    try {

      if(ref){
        try {
          var {data:refProfile} = await window.sb
            .from("profiles").select("id,full_name")
            .eq("referral_code", ref).single();
          if(refProfile){
            document.getElementById("refName").textContent = refProfile.full_name || "a friend";
            document.getElementById("refBox").style.display = "flex";
          }
        } catch(refLookupError) {
          console.warn("Referral lookup skipped:", refLookupError);
        }
      }

      var {data, error} = await window.sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: {
            full_name: name,
            phone: phone,
            referral_code: ref || null,
          }
        }
      });

      if(error){
        var signupMessage = cleanMsg(error.message || error);
        var signupNetworkFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(signupMessage || ""));
        showAlert(
          signupNetworkFailure
            ? "Unable to reach the account service. The deployed SUPABASE_URL points to an unavailable project."
            : signupMessage || "Registration failed. Try again.",
          "error"
        );
        btn.disabled = false; btn.textContent = "Create Account"; return;
      }

      if(!data?.session){
        showAlert(
          "Account created! Check your email for a confirmation link, then sign in.",
          "success"
        );
        btn.disabled = false; btn.textContent = "Create Account";
        return;
      }

      showAlert("Account created! Signing you in…", "success");

      var {error:loginErr} = await window.sb.auth.signInWithPassword({email, password:pass});
      if(loginErr){
        showAlert("Account created! Please sign in manually.", "success");
        setTimeout(function(){ location.href = "/index.html"; }, 1500);
        return;
      }

      setTimeout(function(){ location.href = "/dashboard.html"; }, 1000);

    } catch(e) {
      console.error("Registration error:", e);
      var rawMessage = cleanMsg(e?.message);
      var isFetchFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(rawMessage || e || ""));
      var errMsg = isFetchFailure
        ? "Unable to reach the account service. Confirm that SUPABASE_URL points to an active Supabase project."
        : rawMessage;
      showAlert(errMsg || "Registration failed. Please check your setup and try again.", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

})();
</script>
</body>
</html>
