<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0056b3" />
  <title>CardinalStone — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  
  <style>
    /* Premium Register Page Overrides */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0056b3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Subtle background ambient glows */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(0, 123, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%); /* Green accent glow */
      border-radius: 50%;
      pointer-events: none;
    }

    .wrap { 
      width: 100%;
      max-width: 460px; 
      position: relative;
      z-index: 10;
      animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo { 
      font-size: 30px; 
      font-weight: 800; 
      letter-spacing: -0.5px; 
      color: #0f172a;
      margin-bottom: 8px; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .logo-dot {
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, #007bff, #10b981); /* Blue to Green accent */
      border-radius: 4px;
      transform: rotate(45deg);
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
    }

    .logo-sub { 
      font-size: 15px; 
      color: #64748b; 
      font-weight: 500;
    }

    .title { 
      font-size: 24px; 
      font-weight: 800; 
      color: #0f172a; 
      margin-bottom: 8px; 
      text-align: center;
    }
    
    .sub { 
      font-size: 15px; 
      color: #64748b; 
      margin-bottom: 28px; 
      text-align: center;
      line-height: 1.5;
    }

    /* Referral & Alert Boxes */
    .ref-box {
      background: #f0fdf4; /* Light green tint */
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #166534;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-box {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

    /* Form Fields */
    .field { margin-bottom: 18px; }
    
    .field label { 
      display: block; 
      margin-bottom: 8px; 
      color: #334155; 
      font-size: 14px; 
      font-weight: 700; 
    }
    
    .field input { 
      width: 100%; 
      min-height: 52px; 
      padding: 0 16px; 
      color: #0f172a; 
      background: #f8fafc; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 14px; 
      outline: none; 
      font-size: 15px; 
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s ease; 
    }
    
    .field input::placeholder { color: #94a3b8; }
    
    .field input:focus { 
      border-color: #007bff; 
      background: #ffffff; 
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); 
    }

    /* Button */
    .btn { 
      width: 100%; 
      min-height: 54px;
      padding: 15px;
      border: none;
      border-radius: 14px; 
      cursor: pointer;
      font-size: 16px; 
      font-weight: 800; 
      font-family: inherit;
      letter-spacing: 0.3px;
      color: #ffffff; 
      background: linear-gradient(135deg, #0056b3 0%, #007bff 100%); 
      box-shadow: 0 10px 20px -5px rgba(0, 86, 179, 0.4);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    
    .btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 15px 25px -5px rgba(0, 86, 179, 0.5); 
    }
    
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Footer Switch */
    .switch { 
      text-align: center; 
      font-size: 15px; 
      color: #64748b; 
      margin-top: 28px; 
      font-weight: 500;
    }
    
    .switch a { 
      color: #007bff; 
      font-weight: 800; 
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .switch a:hover { color: #0056b3; }

    @keyframes fadeUp { 
      from { opacity: 0; transform: translateY(15px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; border-radius: 24px; }
      .logo { font-size: 26px; }
    }
  </style>
</head>
<body class="register-page">

<div class="wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-dot"></span>
        CardinalStone
      </div>
      <div class="logo-sub">Create your premium investment account</div>
    </div>

    <div class="title">Join CardinalStone</div>
    <div class="sub">Start your journey to financial freedom today.</div>

    <!-- Ref box — hidden by default -->
    <div id="refBox" class="ref-box" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Referred by: <span id="refName">a friend</span>
    </div>

    <!-- Alert box — hidden by default -->
    <div id="alertBox" class="alert-box" style="display:none"></div>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Your full name" autocomplete="name"/>
    </div>
    
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    
    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="080XXXXXXXX" autocomplete="tel"/>
    </div>
    
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password"/>
    </div>
    
    <div class="field">
      <label for="refCode">Referral Code <span style="color:#94a3b8;font-weight:400;font-size:12px;">(optional)</span></label>
      <input type="text" id="refCode" placeholder="ENTER CODE" style="text-transform:uppercase;letter-spacing:.08em" autocomplete="off"/>
    </div>

    <button class="btn" id="regBtn">Create Account</button>

    <div class="switch">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){

  /* ── helpers ── */
  function cleanMsg(msg){
    if(!msg) return null;
    var s = String(msg).trim();
    // Supabase returns "{}" when DB tables don't exist or trigger fails
    if(s === "{}" || s === "[]" || s === "[object Object]" || s === "undefined") return null;
    // PostgREST error wrapping
    try { var p = JSON.parse(s); if(p && p.message) return p.message; } catch(e){}
    return s;
  }

  function showAlert(msg, type){
    var el  = document.getElementById("alertBox");
    var clean = cleanMsg(msg) || (type==="success"
      ? "Success!"
      : "Something went wrong. Make sure the database schema has been set up in Supabase.");
    el.textContent = clean;
    el.className = "alert-box " + (type==="success" ? "alert-success" : "alert-error");
    el.style.display = "block";
  }
  function hideAlert(){
    document.getElementById("alertBox").style.display = "none";
  }

  /* ── pre-fill ref code from URL ─ */
  var urlRef = new URLSearchParams(location.search).get("ref");
  if(urlRef){
    document.getElementById("refCode").value = urlRef.toUpperCase();
    document.getElementById("refBox").style.display = "flex";
  }

  document.getElementById("refCode").addEventListener("input", function(){
    this.value = this.value.toUpperCase();
  });

  /* ── register ── */
  document.getElementById("regBtn").addEventListener("click", async function(){
    var btn   = this;
    var name  = document.getElementById("fullName").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var pass  = document.getElementById("password").value;
    var ref   = document.getElementById("refCode").value.trim().toUpperCase();

    hideAlert();

    /* validate */
    if(!name || !email || !phone || !pass){
      showAlert("Please fill in all required fields.", "error"); return;
    }
    if(pass.length < 6){
      showAlert("Password must be at least 6 characters.", "error"); return;
    }

    /* wait for page config or /api/config before using Supabase */
    if(window.SerlzoReady) await window.SerlzoReady;
    if(!window.sb){
      showAlert(window.SerlzoConfig?.error || "CardinalStone account service is unavailable. Check the deployment configuration and try again.", "error"); return;
    }

    btn.disabled = true; btn.textContent = "Creating account…";

    try {

      /* Pre-fetch referrer name for the welcome banner only */
      if(ref){
        try {
          var {data:refProfile} = await window.sb
            .from("profiles").select("id,full_name")
            .eq("referral_code", ref).single();
          if(refProfile){
            document.getElementById("refName").textContent = refProfile.full_name || "a friend";
            document.getElementById("refBox").style.display = "flex";
          }
        } catch(refLookupError) {
          console.warn("Referral lookup skipped:", refLookupError);
        }
      }

      /* sign up */
      var {data, error} = await window.sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: {
            full_name: name,
            phone: phone,
            referral_code: ref || null,
          }
        }
      });

      if(error){
        var signupMessage = cleanMsg(error.message || error);
        var signupNetworkFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(signupMessage || ""));
        showAlert(
          signupNetworkFailure
            ? "Unable to reach the account service. The deployed SUPABASE_URL points to an unavailable project."
            : signupMessage || "Registration failed. Try again.",
          "error"
        );
        btn.disabled = false; btn.textContent = "Create Account"; return;
      }

      /* check if email confirmation is required */
      if(!data?.session){
        showAlert(
          "Account created! Check your email for a confirmation link, then sign in.",
          "success"
        );
        btn.disabled = false; btn.textContent = "Create Account";
        return;
      }

      /* no confirmation required — sign in directly */
      showAlert("Account created! Signing you in…", "success");

      var {error:loginErr} = await window.sb.auth.signInWithPassword({email, password:pass});
      if(loginErr){
        showAlert("Account created! Please sign in manually.", "success");
        setTimeout(function(){ location.href = "/index.html"; }, 1500);
        return;
      }

      setTimeout(function(){ location.href = "/dashboard.html"; }, 1000);

    } catch(e) {
      console.error("Registration error:", e);
      var rawMessage = cleanMsg(e?.message);
      var isFetchFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(rawMessage || e || ""));
      var errMsg = isFetchFailure
        ? "Unable to reach the account service. Confirm that SUPABASE_URL points to an active Supabase project."
        : rawMessage;
      showAlert(errMsg || "Registration failed. Please check your setup and try again.", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

})();
</script>
</body>
</html>
