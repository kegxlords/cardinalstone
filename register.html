<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --xf-bg:#fff8fb;--xf-surface:#ffffff;--xf-surface-2:#fdf3f8;--xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330;--xf-mid:#4a3f52;--xf-muted:#6f6478;--xf-ph:#b8aec0;--xf-ink:#2b2330;
      --xf-accent:#d01563;--xf-accent-2:#ff3d8b;--xf-pink-soft:#ffe3ef;--xf-lemon:#ffe23d;--xf-yellow:#ffc93c;--xf-hero-dark:#8a0e42;
      --xf-sweep:linear-gradient(135deg,#ff3d8b 0%,#ffc93c 55%,#ffe23d 100%);
      --xf-hero:linear-gradient(135deg,#8a0e42 0%,#d01563 52%,#ff3d8b 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
    }
    html,body{min-height:100%}
    body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--xf-text);
      background:radial-gradient(circle at 0% 0%,rgba(255,61,139,.08),transparent 32rem),radial-gradient(circle at 100% 100%,rgba(255,226,61,.12),transparent 34rem),var(--xf-bg);
      display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,40px);
      padding-bottom:calc(clamp(14px,4vw,40px) + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;overflow-x:hidden}
    .xf-shell{width:min(100%,980px);background:var(--xf-surface);border:1px solid var(--xf-line);border-radius:28px;
      box-shadow:0 30px 70px -24px rgba(208,21,99,.28),0 0 0 1px rgba(255,61,139,.04);overflow:hidden;animation:xfUp .6s var(--xf-ease) both}
    .xf-brand{position:relative;color:#fff;padding:24px 22px;background:var(--xf-hero);overflow:hidden}
    .xf-brand::before{content:'';position:absolute;top:-60px;right:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,61,.3),transparent 70%)}
    .xf-mark{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
    .xf-diamond{width:15px;height:15px;border-radius:5px;transform:rotate(45deg);background:var(--xf-sweep);box-shadow:0 0 0 5px rgba(255,255,255,.18)}
    .xf-word{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800}
    .xf-tag{position:relative;z-index:1;margin-top:5px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82);font-weight:600}
    .xf-form{padding:clamp(22px,5vw,38px)}
    .xf-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--xf-accent)}
    .xf-h{margin-top:6px;font-family:'Playfair Display',serif;font-size:clamp(1.5rem,5vw,1.95rem);font-weight:800;letter-spacing:-.02em;color:var(--xf-text)}
    .xf-sub{margin-top:8px;font-size:.86rem;line-height:1.6;color:var(--xf-muted)}

    /* ---- JS-required hooks, styled premium ---- */
    .alert-box{display:none;margin:18px 0 4px;padding:13px 15px;border-radius:14px;font-size:.82rem;font-weight:700;line-height:1.45}
    .alert-error{background:#ffe4e9;color:#9f1239;border:1px solid #ffc2cf}
    .alert-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .ref-box{display:none;align-items:center;gap:9px;margin:16px 0 2px;padding:11px 13px;border-radius:14px;font-size:.8rem;font-weight:700;
      background:#fffbe6;border:1px dashed rgba(208,21,99,.4);color:var(--xf-accent)}
    .ref-box svg{width:16px;height:16px;flex:0 0 auto;stroke:var(--xf-accent-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .ref-box b{color:var(--xf-text)}

    .xf-fields{margin-top:18px;display:grid;gap:15px}
    .xf-field label{display:block;margin-bottom:7px;font-size:.74rem;font-weight:800;color:var(--xf-mid)}
    .xf-field label .opt{color:var(--xf-ph);font-weight:600;font-size:.68rem}
    .xf-iw{position:relative;display:flex;align-items:center}
    .xf-iw>.ic{position:absolute;left:14px;width:18px;height:18px;stroke:var(--xf-ph);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .18s}
    .xf-iw input{width:100%;min-height:54px;padding:0 16px 0 44px;font-family:inherit;font-size:16px;font-weight:500;color:var(--xf-text);
      background:var(--xf-surface-2);border:1.5px solid var(--xf-line);border-radius:15px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
    .xf-iw input::placeholder{color:var(--xf-ph)}
    .xf-iw input:focus{background:#fff;border-color:var(--xf-accent-2);box-shadow:0 0 0 4px rgba(255,61,139,.16)}
    .xf-iw:focus-within>.ic{stroke:var(--xf-accent)}

    .btn{width:100%;min-height:56px;margin-top:22px;border:0;border-radius:16px;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:800;
      color:var(--xf-ink);background:var(--xf-sweep);box-shadow:0 14px 28px -8px rgba(208,21,99,.42);position:relative;overflow:hidden;
      transition:transform .18s var(--xf-ease),box-shadow .18s,opacity .18s}
    .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 34px -8px rgba(208,21,99,.5)}
    .btn:hover:not(:disabled)::after{transform:translateX(120%)}
    .btn:active:not(:disabled){transform:scale(.985)}
    .btn:disabled{opacity:.62;cursor:wait}
    .xf-foot{margin-top:20px;text-align:center;font-size:.84rem;color:var(--xf-muted)}
    .xf-foot a{color:var(--xf-accent);font-weight:800;text-decoration:none}
    .xf-foot a:hover{color:var(--xf-pink-deep);text-decoration:underline}
    @keyframes xfUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:900px){.xf-shell{display:grid;grid-template-columns:.92fr 1.08fr;min-height:600px}
      .xf-brand{display:flex;align-items:center;padding:46px 42px}.xf-form{display:flex;flex-direction:column;justify-content:center;padding:46px 44px}}
    @media(max-width:899px){.xf-brand{padding:20px 22px}.xf-mark .xf-word{font-size:1.3rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body class="register-page">

<div class="xf-shell">
  <aside class="xf-brand">
    <div class="xf-mark"><span class="xf-diamond"></span><span class="xf-word">XFusion</span></div>
    <p class="xf-tag">Premium Investing · Reimagined</p>
  </aside>

  <section class="xf-form">
    <p class="xf-eyebrow">Get started</p>
    <h1 class="xf-h">Create your account</h1>
    <p class="xf-sub">Join XFusion and start turning gems into daily income — in under a minute.</p>

    <!-- JS hooks: alertBox / refBox / refName (ids + classes preserved) -->
    <div id="refBox" class="ref-box" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Referred by: <b id="refName">a friend</b>
    </div>
    <div id="alertBox" class="alert-box" style="display:none"></div>

    <!-- NO <form> wrapper; button type=button (matches original click-based JS) -->
    <div class="xf-fields">
      <div class="xf-field">
        <label for="fullName">Full name</label>
        <div class="xf-iw"><svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="fullName" placeholder="Your full name" autocomplete="name"/></div>
      </div>
      <div class="xf-field">
        <label for="email">Email address</label>
        <div class="xf-iw"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/></div>
      </div>
      <div class="xf-field">
        <label for="phone">Phone number</label>
        <div class="xf-iw"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
          <input type="tel" id="phone" placeholder="080XXXXXXXX" autocomplete="tel"/></div>
      </div>
      <div class="xf-field">
        <label for="password">Password</label>
        <div class="xf-iw"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password"/></div>
      </div>
      <div class="xf-field">
        <label for="refCode">Referral code <span class="opt">(optional)</span></label>
        <div class="xf-iw"><svg class="ic" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4a1.2 1.2 0 0 1 1.2-1.2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <input type="text" id="refCode" placeholder="ENTER CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em"/></div>
      </div>
    </div>

    <button class="btn" type="button" id="regBtn">Create Account</button>
    <p class="xf-foot">Already have an account? <a href="index.html">Sign in</a></p>
  </section>
</div>

<!-- script-tag defer pattern = ORIGINAL register (CDN + supabase.js non-defer) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){

  /* ── helpers ── */
  function cleanMsg(msg){
    if(!msg) return null;
    var s = String(msg).trim();
    if(s === "{}" || s === "[]" || s === "[object Object]" || s === "undefined") return null;
    try { var p = JSON.parse(s); if(p && p.message) return p.message; } catch(e){}
    return s;
  }

  function showAlert(msg, type){
    var el  = document.getElementById("alertBox");
    var clean = cleanMsg(msg) || (type==="success"
      ? "Success!"
      : "Something went wrong. Make sure the database schema has been set up in Supabase.");
    el.textContent = clean;
    el.className = "alert-box " + (type==="success" ? "alert-success" : "alert-error");
    el.style.display = "block";
  }
  function hideAlert(){
    document.getElementById("alertBox").style.display = "none";
  }

  /* ── pre-fill ref code from URL ─ */
  var urlRef = new URLSearchParams(location.search).get("ref");
  if(urlRef){
    document.getElementById("refCode").value = urlRef.toUpperCase();
    document.getElementById("refBox").style.display = "flex";
  }

  document.getElementById("refCode").addEventListener("input", function(){
    this.value = this.value.toUpperCase();
  });

  /* ── register ── */
  document.getElementById("regBtn").addEventListener("click", async function(){
    var btn   = this;
    var name  = document.getElementById("fullName").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var pass  = document.getElementById("password").value;
    var ref   = document.getElementById("refCode").value.trim().toUpperCase();

    hideAlert();

    if(!name || !email || !phone || !pass){
      showAlert("Please fill in all required fields.", "error"); return;
    }
    if(pass.length < 6){
      showAlert("Password must be at least 6 characters.", "error"); return;
    }

    if(window.SerlzoReady) await window.SerlzoReady;
    if(!window.sb){
      showAlert(window.SerlzoConfig?.error || "XFusion account service is unavailable. Check the deployment configuration and try again.", "error"); return;
    }

    btn.disabled = true; btn.textContent = "Creating account…";

    try {

      if(ref){
        try {
          var {data:refProfile} = await window.sb
            .from("profiles").select("id,full_name")
            .eq("referral_code", ref).single();
          if(refProfile){
            document.getElementById("refName").textContent = refProfile.full_name || "a friend";
            document.getElementById("refBox").style.display = "flex";
          }
        } catch(refLookupError) {
          console.warn("Referral lookup skipped:", refLookupError);
        }
      }

      var {data, error} = await window.sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: {
            full_name: name,
            phone: phone,
            referral_code: ref || null,
          }
        }
      });

      if(error){
        var signupMessage = cleanMsg(error.message || error);
        var signupNetworkFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(signupMessage || ""));
        showAlert(
          signupNetworkFailure
            ? "Unable to reach the account service. The deployed SUPABASE_URL points to an unavailable project."
            : signupMessage || "Registration failed. Try again.",
          "error"
        );
        btn.disabled = false; btn.textContent = "Create Account"; return;
      }

      if(!data?.session){
        showAlert(
          "Account created! Check your email for a confirmation link, then sign in.",
          "success"
        );
        btn.disabled = false; btn.textContent = "Create Account";
        return;
      }

      showAlert("Account created! Signing you in…", "success");

      var {error:loginErr} = await window.sb.auth.signInWithPassword({email, password:pass});
      if(loginErr){
        showAlert("Account created! Please sign in manually.", "success");
        setTimeout(function(){ location.href = "/index.html"; }, 1500);
        return;
      }

      setTimeout(function(){ location.href = "/dashboard.html"; }, 1000);

    } catch(e) {
      console.error("Registration error:", e);
      var rawMessage = cleanMsg(e?.message);
      var isFetchFailure = /failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(rawMessage || e || ""));
      var errMsg = isFetchFailure
        ? "Unable to reach the account service. Confirm that SUPABASE_URL points to an active Supabase project."
        : rawMessage;
      showAlert(errMsg || "Registration failed. Please check your setup and try again.", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

})();
</script>
</body>
</html>
