<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Account Suspended — Redpay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    body{
      padding-bottom:calc(24px + env(safe-area-inset-bottom)) !important;
    }

    .rp-banned-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .rp-banned-card{
      position:relative;
      overflow:hidden;
      width:100%;
      max-width:440px;
      padding:38px 28px 32px;
      text-align:center;
      background:var(--rp-surface);
      border:1px solid var(--rp-line);
      border-radius:28px;
      box-shadow:var(--rp-shadow);
      animation:rpUp .55s var(--rp-ease) both;
    }

    .rp-banned-card::before{
      content:'';
      position:absolute;
      top:-60px;
      right:-50px;
      width:200px;
      height:200px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(220,38,38,.10), transparent 70%);
      pointer-events:none;
    }

    .rp-banned-card::after{
      content:'';
      position:absolute;
      bottom:-90px;
      left:-45px;
      width:190px;
      height:190px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,183,3,.10), transparent 70%);
      pointer-events:none;
    }

    .rp-banned-brand{
      position:relative;
      z-index:1;
      justify-content:center;
      margin-bottom:22px;
      color:var(--rp-text);
    }

    .rp-banned-icon{
      position:relative;
      z-index:1;
      width:84px;
      height:84px;
      margin:0 auto 22px;
      background:var(--rp-danger-soft);
      border:1px solid rgba(220,38,38,.18);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--rp-danger);
    }

    .rp-banned-icon svg{
      width:40px;
      height:40px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .rp-banned-card h1{
      position:relative;
      z-index:1;
      font-family:'Sora',sans-serif;
      font-size:clamp(1.7rem,6vw,2.2rem);
      font-weight:800;
      letter-spacing:-.03em;
      line-height:1.1;
      color:var(--rp-text);
      margin:0 0 12px;
    }

    .rp-banned-card p{
      position:relative;
      z-index:1;
      font-size:14.5px;
      line-height:1.65;
      color:var(--rp-muted);
      margin:0 0 28px;
      font-weight:600;
    }

    .rp-banned-card .rp-btn{
      position:relative;
      z-index:1;
      max-width:320px;
      margin:0 auto;
    }

    .rp-banned-help{
      position:relative;
      z-index:1;
      margin-top:18px;
      font-size:12px;
      color:var(--rp-muted);
      font-weight:700;
    }

    .rp-banned-help a{
      color:var(--rp-primary);
      font-weight:800;
      text-decoration:none;
    }

    .rp-banned-help a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <div class="rp-banned-wrap">
    <section class="rp-banned-card" role="alert">
      <div class="rp-brand rp-banned-brand" aria-hidden="true">
        <span class="rp-diamond"></span>
        <span class="rp-word">REDPAY</span>
      </div>

      <div class="rp-banned-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>Account Suspended</h1>
      <p>This Redpay account is currently suspended. Please contact our support team if you believe this is a mistake.</p>

      <a class="rp-btn" href="index.html">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;">
          <path d="M19 12H5"></path>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Sign In
      </a>

      <p class="rp-banned-help">
        Need help? Reach support via
        <a href="https://t.me/+pVKbzwmts9wwMTU0" target="_blank" rel="noopener">Telegram</a>.
      </p>
    </section>
  </div>

  <script src="assets/js/serlzo.js" defer></script>
</body>
</html>
