<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>Account Suspended — XFusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    :root {
      --xf-bg:#fff8fb; --xf-surface:#ffffff; --xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330; --xf-muted:#6f6478; --xf-accent:#d01563; --xf-accent-2:#ff3d8b;
      --xf-pink-soft:#ffe3ef; --xf-lemon:#ffe23d; --xf-yellow:#ffc93c; --xf-danger:#e11d48; --xf-hero-dark:#8a0e42;
      --xf-sweep:linear-gradient(135deg,var(--xf-accent-2) 0%,var(--xf-yellow) 55%,var(--xf-lemon) 100%);
      --xf-hero:linear-gradient(135deg,var(--xf-hero-dark) 0%,var(--xf-accent) 52%,var(--xf-accent-2) 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
    }
    body {
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--xf-text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:
        radial-gradient(circle at 0% 0%, rgba(255,61,139,.07), transparent 30rem),
        radial-gradient(circle at 100% 100%, rgba(255,226,61,.12), transparent 34rem),
        var(--xf-bg);
      -webkit-text-size-adjust:100%;
    }
    .banned-container { width:100%; max-width:440px; animation:xfUp .55s var(--xf-ease) both; }
    .banned-card {
      position:relative; overflow:hidden; background:var(--xf-surface);
      border:1px solid var(--xf-line); border-radius:28px; padding:40px 32px 34px; text-align:center;
      box-shadow:0 30px 60px -24px rgba(208,21,99,.28), 0 0 0 1px rgba(255,61,139,.04);
    }
    .banned-card::before { content:''; position:absolute; top:-60px; right:-50px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(225,29,72,.10), transparent 70%); }
    .banned-brand { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:24px; }
    .banned-diamond { width:14px; height:14px; border-radius:5px; transform:rotate(45deg); background:var(--xf-sweep); box-shadow:0 0 0 4px rgba(255,61,139,.14); }
    .banned-word { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:800; letter-spacing:-.01em; color:var(--xf-text); }
    .banned-icon-wrap {
      position:relative; z-index:1; width:84px; height:84px; margin:0 auto 22px;
      background:var(--xf-pink-soft); border:1px solid #ffc2cf; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }
    .banned-icon-wrap svg { width:40px; height:40px; stroke:var(--xf-danger); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .banned-card h1 { position:relative; z-index:1; font-family:'Playfair Display',serif; font-size:24px; font-weight:800; color:var(--xf-text); margin-bottom:12px; letter-spacing:-.02em; }
    .banned-card p { position:relative; z-index:1; font-size:15px; color:var(--xf-muted); line-height:1.6; margin:0 0 30px; }
    .btn-primary-premium {
      position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; min-height:54px; border-radius:15px; border:0; cursor:pointer;
      background:var(--xf-sweep); color:var(--xf-text); font-family:inherit;
      font-size:16px; font-weight:800; text-decoration:none;
      box-shadow:0 14px 28px -10px rgba(208,21,99,.45); transition:transform .18s var(--xf-ease), box-shadow .18s ease;
    }
    .btn-primary-premium:hover { transform:translateY(-2px); box-shadow:0 18px 34px -10px rgba(208,21,99,.55); }
    .btn-primary-premium:active { transform:scale(.985); }
    .btn-primary-premium svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .banned-help { position:relative; z-index:1; margin-top:18px; font-size:12px; color:var(--xf-muted); }
    .banned-help a { color:var(--xf-accent); font-weight:800; text-decoration:none; }
    .banned-help a:hover { text-decoration:underline; }
    @keyframes xfUp { from { opacity:0; transform:translateY(15px);} to { opacity:1; transform:translateY(0);} }
    @media (max-width:480px) { .banned-card { padding:32px 24px 28px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  </style>
</head>
<body>
  <div class="banned-container">
    <section class="banned-card" role="alert">
      <div class="banned-brand"><span class="banned-diamond" aria-hidden="true"></span><span class="banned-word">XFusion</span></div>
      <div class="banned-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>Account Suspended</h1>
      <p>This XFusion account is currently suspended. Please contact our support team if you believe this is a mistake.</p>
      <a class="btn-primary-premium" href="index.html">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
        Return to Sign In
      </a>
      <p class="banned-help">Need help? Reach support via <a href="https://t.me/+pVKbzwmts9wwMTU0" target="_blank" rel="noopener">Telegram</a>.</p>
    </section>
  </div>
</body>
</html>
