<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#dc2626" />
  <title>Account Suspended — CardinalStone</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    body { 
      background: #f8fafc !important; 
      color: #0f172a !important; 
      min-height: 100vh; 
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    .banned-container {
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    .banned-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }

    .banned-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #fef2f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fecaca;
    }

    .banned-icon-wrap svg {
      width: 40px;
      height: 40px;
      color: #dc2626 !important;
    }

    .banned-card h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a !important;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
    }

    .banned-card p {
      font-size: 15px;
      color: #64748b !important;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    .btn-primary-premium {
      display: block;
      width: 100%;
      min-height: 54px;
      line-height: 54px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #0056b3 0%, #007bff 100%);
      color: #ffffff !important;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 86, 179, 0.25);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary-premium:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0, 86, 179, 0.3); }
    .btn-primary-premium:active { transform: translateY(0); }

    @keyframes fadeUp { 
      from { opacity: 0; transform: translateY(15px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    @media (max-width: 480px) {
      .banned-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="banned-container">
    <section class="banned-card">
      <div class="banned-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>Account Suspended</h1>
      <p>This CardinalStone account is currently suspended. Please contact our support team if you believe this is a mistake.</p>
      <a class="btn-primary-premium" href="index.html">Return to Sign In</a>
    </section>
  </div>
</body>
</html>
