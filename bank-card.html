<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Payment Methods</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    body{padding-bottom:calc(30px + env(safe-area-inset-bottom))!important}
    .page-wrap{padding-bottom:30px!important}
    .pm-hero{text-align:left}
    .pm-hero .hero-title{
      font-family:'Sora',sans-serif;
      font-size:1.35rem;
      font-weight:800;
      margin-top:6px;
      color:#fff;
      letter-spacing:-.02em;
    }
    #cardList{padding:0 16px}
    .form-section{margin:14px 16px 0!important;padding:20px!important}
    .default-row{
      display:flex;
      align-items:flex-start;
      gap:10px;
      margin:14px 0 16px;
      padding:12px 14px;
      background:var(--rp-surface-2);
      border:1px solid var(--rp-line);
      border-radius:14px;
    }
    .default-row input[type=checkbox]{
      width:18px;
      height:18px;
      margin-top:1px;
      accent-color:var(--rp-primary);
      flex:0 0 18px;
      cursor:pointer;
    }
    .default-row label{
      font-size:13px;
      font-weight:800;
      color:var(--rp-mid);
      cursor:pointer;
      line-height:1.35;
    }
    .default-row label small{
      display:block;
      margin-top:2px;
      font-size:11px;
      font-weight:700;
      color:var(--rp-muted);
    }
    #toast{bottom:calc(28px + env(safe-area-inset-bottom))!important}
    .pm-tip{
      margin:14px 16px 0;
      text-align:center;
      font-size:11.5px;
      line-height:1.5;
      color:var(--rp-muted);
      font-weight:700;
    }
    .pm-tip b{color:var(--rp-primary)}
    @media (max-width:380px){
      .pm-hero,#cardList,.form-section,.pm-tip{margin-inline:12px}
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <a class="back-btn-premium" href="profile.html" aria-label="Back to profile">‹</a>
      <div class="topbar-title">Payment Methods</div>
      <div class="rp-spacer"></div>
    </header>

    <section class="rp-hero wallet-hero pm-hero">
      <div class="rp-brand" style="margin-bottom:12px;">
        <span class="rp-diamond"></span>
        <span class="rp-word">REDPAY</span>
      </div>
      <div class="wallet-label">Payout accounts</div>
      <div class="hero-title">Add the bank account you want refunds and withdrawals sent to.</div>
      <p class="dc-sub" style="margin-top:8px;">Mark one as default and we'll use it automatically.</p>
    </section>

    <div class="section-label"><span class="bar rp-bar"></span><span>Saved Accounts</span></div>
    <div id="cardList">
      <div class="loader-wrap"><div class="loader"></div></div>
    </div>

    <div class="section-label"><span class="bar rp-bar"></span><span>Add New Account</span></div>

    <section class="form-section rp-panel">
      <div id="formAlert" class="alert"></div>

      <div class="rp-fields">
        <div class="rp-field">
          <label class="field-label" for="bankName">Bank Name</label>
          <input class="field-input" id="bankName" placeholder="e.g. OPay, GTBank, Access Bank" />
        </div>

        <div class="rp-field">
          <label class="field-label" for="acctNum">Account Number</label>
          <input class="field-input" id="acctNum" type="tel" maxlength="10" inputmode="numeric" placeholder="10-digit account number" />
        </div>

        <div class="rp-field">
          <label class="field-label" for="acctName">Account Name</label>
          <input class="field-input" id="acctName" placeholder="As it appears on your bank" />
        </div>
      </div>

      <div class="default-row">
        <input type="checkbox" id="isDefault" />
        <label for="isDefault">Set as default refund account<small>Used automatically for payouts</small></label>
      </div>

      <button class="btn btn-primary" type="button" onclick="addCard()">Save Account</button>
    </section>

    <p class="pm-tip">Tip: keep your <b>default</b> account current so withdrawals never stall.</p>
    <div style="height:20px"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/icons.js" defer></script>

  <script>
  (function(){
    var uid="";
    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
    waitSb(async function(){
      var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
      uid=s.user.id; await loadCards();
    });

    async function loadCards(){
      var r=await fetch("/api/user?action=bank-cards&user_id="+uid);
      var d=await r.json();
      var cards=d.cards||[];
      var el=document.getElementById("cardList");
      if(!cards.length){ el.innerHTML='<div class="empty"><div class="empty-icon"></div><p>No saved accounts yet.</p></div>'; return; }
      el.innerHTML=cards.map(function(c){
        return '<div class="bc-item">'+
          '<div style="display:flex;align-items:flex-start;justify-content:space-between">'+
            '<div>'+
              '<div class="bc-bank">'+c.bank_name+(c.is_default?' <span class="pill pill-purple" style="font-size:10px">Default</span>':'')+'</div>'+
              '<div class="bc-num">'+c.account_number+'</div>'+
              '<div class="bc-name">'+c.account_name+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="bc-actions">'+
            '<button onclick="deleteCard(\''+c.id+'\')" class="btn btn-ghost btn-sm" type="button" style="color:var(--danger);border:1.5px solid var(--danger);background:transparent">Remove</button>'+
          '</div>'+
        '</div>';
      }).join("");
    }

    window.addCard=async function(){
      var al=document.getElementById("formAlert");
      var bank=document.getElementById("bankName").value.trim();
      var num =document.getElementById("acctNum").value.trim();
      var name=document.getElementById("acctName").value.trim();
      var def =document.getElementById("isDefault").checked;
      if(!bank||!num||!name){ al.textContent="All fields are required"; al.className="alert alert-error show"; return; }
      if(num.length!==10||isNaN(num)){ al.textContent="Account number must be 10 digits"; al.className="alert alert-error show"; return; }
      al.className="alert";
      var r=await fetch("/api/user?action=add-bank-card",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,bank_name:bank,account_number:num,account_name:name,is_default:def})});
      var d=await r.json();
      if(d.ok){
        window.SerlzoAuth.toast("Account saved!");
        document.getElementById("bankName").value=""; document.getElementById("acctNum").value=""; document.getElementById("acctName").value=""; document.getElementById("isDefault").checked=false;
        await loadCards();
      } else { al.textContent=d.error||"Error"; al.className="alert alert-error show"; }
    };

    window.deleteCard=async function(id){
      if(!confirm("Remove this account?")) return;
      await fetch("/api/user?action=delete-bank-card",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,card_id:id})});
      window.SerlzoAuth.toast("Account removed"); await loadCards();
    };
  })();
  </script>
</body>
</html>
