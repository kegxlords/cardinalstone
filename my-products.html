<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — My Active Plans</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    #plansList{padding:0 16px}
    .sc-note{
      margin-top:14px;
      font-size:12px;
      line-height:1.55;
      color:rgba(255,255,255,.88);
      font-weight:600;
      text-align:left;
    }
    .sc-note b{color:var(--rp-accent)}
    .plan-stats div:first-child .plan-stat-val{color:var(--rp-primary)!important}
    .plan-stats div:last-child .plan-stat-val{color:var(--rp-success)!important}
    .progress-header span:last-child{color:var(--rp-primary);font-weight:800}
    @media (max-width:380px){
      #plansList{padding-inline:12px}
      .summary-card{margin-inline:12px}
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <a class="back-btn-premium" href="dashboard.html" aria-label="Back to dashboard">‹</a>
      <div class="topbar-title">My Active Plans</div>
      <div class="rp-spacer"></div>
    </header>

    <section class="summary-card rp-hero">
      <div class="summary-label">Total Active Investment</div>
      <div class="summary-val" id="totalInvested">₦0.00</div>

      <div class="summary-stats">
        <div>
          <div class="summary-stat-val" id="totalEarned">₦0.00</div>
          <div class="summary-stat-lbl">Total Earned</div>
        </div>
        <div>
          <div class="summary-stat-val" id="activeCount">0</div>
          <div class="summary-stat-lbl">Active Plans</div>
        </div>
      </div>

      <p class="sc-note">Income accrues every day on your active plans — tap <b>Claim</b> on any plan to move what you've earned into your wallet.</p>
    </section>

    <div class="section-label"><span class="bar rp-bar"></span><span>Your Investments</span></div>

    <div id="plansList">
      <div class="loader-wrap"><div class="loader"></div></div>
    </div>

  </div>

  <nav class="bottom-nav-premium" aria-label="Primary">
    <button class="nav-item-premium" type="button" onclick="location.href='dashboard.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <span>Home</span>
    </button>

    <button class="nav-item-premium active" type="button" onclick="location.href='products.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </div>
      <span>Plans</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='team.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <span>Team</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='notifications.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <span>Alerts</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='profile.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Profile</span>
    </button>
  </nav>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>

  <script>
  (function(){
    var userId="";
    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
    
    waitSb(async function(){
      var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
      userId=s.user.id;
      
      var {data:prods} = await window.sb.from("user_products").select("*, products(name, price)").eq("user_id",userId).order("created_at", {ascending: false});
      
      var list = document.getElementById("plansList");
      if(!prods || prods.length === 0){
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg></div><p>No active plans yet.<br><a href="products.html">Browse Plans →</a></p></div>';
        document.getElementById("totalInvested").textContent = "₦0";
        document.getElementById("totalEarned").textContent = "₦0";
        document.getElementById("activeCount").textContent = "0";
        return;
      }

      var totalInv = 0, totalEarn = 0, active = 0;
      list.innerHTML = prods.map(function(p){
        var isActive = p.status === "active";
        if(isActive) { active++; totalInv += Number(p.products?.price || 0); totalEarn += Number(p.total_collected || 0); }
        var pct = p.duration_days ? Math.min(100, Math.round((p.days_collected / p.duration_days) * 100)) : 0;
        var badge = isActive ? '<span class="plan-badge badge-active">Active</span>' : '<span class="plan-badge badge-completed">Completed</span>';
        var btn = isActive ? '<button class="btn-claim" type="button" onclick="claimIncome(\''+p.id+'\')">Claim Daily Income</button>' : '<button class="btn-claim" type="button" disabled>Plan Completed</button>';
        
        return '<div class="plan-card">'+
          '<div class="plan-header"><div><div class="plan-name">'+(p.products?.name || "Plan")+'</div><div class="plan-invested">Invested: '+window.SerlzoAuth.money(p.products?.price || 0)+'</div></div>'+badge+'</div>'+
          '<div class="plan-body">'+
            '<div class="plan-stats"><div><div class="plan-stat-val">'+window.SerlzoAuth.money(p.daily_income)+'</div><div class="plan-stat-lbl">Daily Income</div></div><div><div class="plan-stat-val">'+window.SerlzoAuth.money(p.total_collected || 0)+'</div><div class="plan-stat-lbl">Total Collected</div></div></div>'+
            '<div class="progress-wrap"><div class="progress-header"><span>'+p.days_collected+' / '+p.duration_days+' Days</span><span>'+pct+'%</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>'+
            btn+
          '</div></div>';
      }).join("");

      document.getElementById("totalInvested").textContent = "₦" + totalInv.toLocaleString();
      document.getElementById("totalEarned").textContent = "₦" + totalEarn.toLocaleString();
      document.getElementById("activeCount").textContent = active;
    });

    window.claimIncome = async function(planId){
      var btn = event.target;
      btn.disabled = true; btn.textContent = "Processing…";
      var {data, error} = await window.sb.rpc("claim_daily_income", { p_plan_id: planId });
      if(error || !data?.ok){
        window.SerlzoAuth.toast(data?.error || error?.message || "Claim failed");
        btn.disabled = false; btn.textContent = "Claim Daily Income";
      } else {
        window.SerlzoAuth.toast("Income claimed successfully!");
        setTimeout(()=> location.reload(), 1000);
      }
    };
  })();
  </script>
</body>
</html>
