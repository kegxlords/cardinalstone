<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0056b3" />
  <title>CardinalStone — Service Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    body { background: #ffffff !important; color: #0f172a !important; min-height: 100vh; padding-bottom: 90px; font-family: 'DM Sans', sans-serif; }
    * { -webkit-tap-highlight-color: transparent; }
    .page-wrap { width: 100%; max-width: 100%; padding-bottom: 100px; background: transparent !important; }
    
    .topbar-premium { background: #ffffff !important; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #e2e8f0 !important; }
    .topbar-title { font-size: 18px; font-weight: 800; color: #0f172a !important; }
    .back-btn-premium { width: 40px; height: 40px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; color: #0f172a !important; text-decoration: none; font-size: 20px; font-weight: 700; transition: all 0.2s ease; }
    .back-btn-premium:hover { background: #f1f5f9; transform: translateX(-2px); }
    .clear-btn { background: none; border: none; color: #ef4444 !important; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .clear-btn:hover { opacity: 0.8; }

    .notif-list { padding: 16px; }
    .notif-item { 
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; 
      padding: 16px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start;
      transition: all 0.2s ease;
    }
    .notif-item.unread { 
      background: #eff6ff; border-color: #bfdbfe; border-left: 4px solid #0056b3; 
    }
    .notif-icon { 
      width: 42px; height: 42px; border-radius: 12px; background: #f1f5f9; 
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #64748b !important;
    }
    .notif-item.unread .notif-icon { background: #ffffff; color: #0056b3 !important; }
    .notif-icon svg { width: 20px; height: 20px; }
    .notif-content { flex: 1; min-width: 0; }
    .notif-title { font-size: 14px; font-weight: 700; color: #0f172a !important; margin-bottom: 4px; }
    .notif-msg { font-size: 13px; color: #475569 !important; line-height: 1.5; margin-bottom: 6px; }
    .notif-time { font-size: 11px; color: #94a3b8 !important; font-weight: 500; }

    .empty-state { text-align: center; padding: 60px 20px; color: #64748b !important; }
    .empty-state-icon { width: 64px; height: 64px; margin: 0 auto 16px; background: #f8fafc; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .empty-state-icon svg { width: 32px; height: 32px; color: #94a3b8 !important; }

    .bottom-nav-premium { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff !important; border-top: 1px solid #e2e8f0 !important; display: grid; grid-template-columns: repeat(5, 1fr); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 100; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03); }
    .nav-item-premium { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; cursor: pointer; transition: all 0.2s ease; border: none; background: none; color: #64748b !important; font-size: 11px; font-weight: 600; }
    .nav-item-premium.active { color: #0056b3 !important; }
    .nav-icon-premium { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .nav-icon-premium svg { width: 24px; height: 24px; }
    #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0f172a; color: #ffffff !important; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 300; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <div class="topbar-premium">
    <a class="back-btn-premium" href="dashboard.html">‹</a>
    <span class="topbar-title">Service Alerts</span>
    <button class="clear-btn" onclick="markAll()">Clear All</button>
  </div>

  <div class="notif-list" id="notifList">
    <div style="padding: 40px 20px; display: flex; justify-content: center;">
      <div class="loader" style="width: 32px; height: 32px; border: 3px solid #f1f5f9; border-top-color: #0056b3; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav-premium">
  <button class="nav-item-premium" onclick="location.href='dashboard.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div><span>Home</span></button>
  <button class="nav-item-premium" onclick="location.href='products.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg></div><span>Plans</span></button>
  <button class="nav-item-premium" onclick="location.href='team.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div><span>Team</span></button>
  <button class="nav-item-premium active" onclick="location.href='notifications.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><span>Alerts</span></button>
  <button class="nav-item-premium" onclick="location.href='profile.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><span>Profile</span></button>
</nav>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){
  var uid="";
  function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
  
  waitSb(async function(){
    var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
    uid=s.user.id; 
    await load();
  });

  async function load(){
    var {data}=await window.sb.from("notifications").select("*").eq("user_id",uid).order("created_at",{ascending:false}).limit(50);
    var el=document.getElementById("notifList");
    
    if(!data||!data.length){ 
      el.innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>'; 
      return; 
    }
    
    el.innerHTML=data.map(function(n){
      var iconSvg = n.title.toLowerCase().includes('credit') || n.title.toLowerCase().includes('success') 
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        
      return '<div class="notif-item'+(n.is_read?'':' unread')+'">'+
        '<div class="notif-icon">'+iconSvg+'</div>'+
        '<div class="notif-content">'+
          '<div class="notif-title">'+n.title+'</div>'+
          '<div class="notif-msg">'+n.message+'</div>'+
          '<div class="notif-time">'+window.SerlzoAuth.timeAgo(n.created_at)+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    
    // Mark all read
    await window.sb.from("notifications").update({is_read:true}).eq("user_id",uid).eq("is_read",false);
  }

  window.markAll=async function(){
    await window.sb.from("notifications").delete().eq("user_id",uid);
    window.SerlzoAuth.toast("All alerts cleared");
    document.getElementById("notifList").innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>';
  };
})();
</script>
</body>
</html>
