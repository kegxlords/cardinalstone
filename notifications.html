<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Notifications</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    .topbar-premium{
      animation:none !important;
    }

    .notif-list{
      padding:16px;
    }

    @media (max-width:380px){
      .notif-list{
        padding:12px;
      }

      .notif-item{
        padding:14px;
      }
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <a class="back-btn-premium" href="dashboard.html" aria-label="Back to dashboard">‹</a>
      <div class="topbar-title">Notifications</div>
      <button class="clear-btn" type="button" onclick="markAll()">Clear All</button>
    </header>

    <div class="notif-list" id="notifList">
      <div class="loader-wrap"><div class="loader"></div></div>
    </div>

  </div>

  <nav class="bottom-nav-premium" aria-label="Primary">
    <button class="nav-item-premium" type="button" onclick="location.href='dashboard.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <span>Home</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='products.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </div>
      <span>Plans</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='team.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <span>Team</span>
    </button>

    <button class="nav-item-premium active" type="button" onclick="location.href='notifications.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <span>Alerts</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='profile.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Profile</span>
    </button>
  </nav>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/icons.js" defer></script>

  <script>
  (function(){
    var uid="";
    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}
    
    waitSb(async function(){
      var s=await window.SerlzoAuth.requireAuth(); if(!s)return;
      uid=s.user.id; 
      await load();
    });

    async function load(){
      var {data}=await window.sb.from("notifications").select("*").eq("user_id",uid).order("created_at",{ascending:false}).limit(50);
      var el=document.getElementById("notifList");
      
      if(!data||!data.length){ 
        el.innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>'; 
        return; 
      }
      
      el.innerHTML=data.map(function(n){
        var iconSvg = n.title.toLowerCase().includes('credit') || n.title.toLowerCase().includes('success') 
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
          
        return '<div class="notif-item'+(n.is_read?'':' unread')+'">'+
          '<div class="notif-icon">'+iconSvg+'</div>'+
          '<div class="notif-content">'+
            '<div class="notif-title">'+n.title+'</div>'+
            '<div class="notif-msg">'+n.message+'</div>'+
            '<div class="notif-time">'+window.SerlzoAuth.timeAgo(n.created_at)+'</div>'+
          '</div>'+
        '</div>';
      }).join("");
      
      // Mark all read
      await window.sb.from("notifications").update({is_read:true}).eq("user_id",uid).eq("is_read",false);
    }

    window.markAll=async function(){
      await window.sb.from("notifications").delete().eq("user_id",uid);
      window.SerlzoAuth.toast("All alerts cleared");
      document.getElementById("notifList").innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></div><p>No new notifications.</p></div>';
    };
  })();
  </script>
</body>
</html>
