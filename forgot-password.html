<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />
</head>
<body class="rp-auth-body" data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <main class="rp-auth-card">
    <aside class="rp-auth-brand">
      <div class="rp-auth-brand-inner">
        <div class="rp-brand">
          <span class="rp-diamond"></span>
          <span class="rp-word">Redpay</span>
        </div>
        <p class="rp-auth-tag">Secure account recovery</p>
      </div>
    </aside>

    <section class="rp-auth-panel">
      <div id="requestState">
        <p class="rp-eyebrow">Account recovery</p>
        <h1 class="rp-h">Forgot password?</h1>
        <p class="rp-sub">Enter the email on your account and we'll send a one-time reset link.</p>

        <div id="alert" class="alert"></div>

        <div class="rp-fields">
          <div class="rp-field">
            <label for="email">Email address</label>
            <div class="rp-input-wrap">
              <svg class="rp-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <input class="rp-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" />
            </div>
          </div>
        </div>

        <button class="rp-btn" type="button" id="forgotBtn">Send reset link</button>
        <p class="rp-foot">Remembered it? <a href="index.html">Back to sign in</a></p>
      </div>

      <div id="sentState" class="empty-state" style="display:none;">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </div>
        <h2 class="rp-h" style="font-size:1.35rem;">Check your inbox</h2>
        <p>We sent a password-reset link to <strong id="sentEmail">your email</strong>. It expires in 60 minutes.</p>
        <button class="btn-ghost" type="button" id="resendBtn" style="margin-top:16px;">Resend link</button>
        <p class="rp-foot"><a href="index.html">Back to sign in</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function cleanMsg(msg){ if(!msg) return null; var s=String(msg).trim(); if(s==="{}"||s==="[]"||s==="[object Object]"||s==="undefined") return null; try{var p=JSON.parse(s); if(p&&p.message) return p.message;}catch(e){} return s; }
    function showAlert(msg,type){ var el=$("alert"); el.textContent=cleanMsg(msg)||msg; el.className="xf-alert show "+(type==="success"?"success":"error"); }
    function hideAlert(){ $("alert").className="xf-alert"; }
    function setLoading(on){ var b=$("forgotBtn"); b.disabled=!!on; b.classList.toggle("loading",!!on); $("forgotBtnTxt").textContent=on?"Sending…":"Send reset link"; }

    var cooldown=null;
    function startCooldown(sec){
      var btn=$("resendBtn"); var n=sec; btn.disabled=true; btn.textContent="Resend in "+n+"s";
      clearInterval(cooldown);
      cooldown=setInterval(function(){ n--; if(n<=0){ clearInterval(cooldown); btn.disabled=false; btn.textContent="Resend link"; } else btn.textContent="Resend in "+n+"s"; },1000);
    }

    async function sendLink(){
      var email=$("email").value.trim();
      hideAlert();
      if(!email){ showAlert("Please enter your email address.","error"); return false; }
      if(!window.sb){ showAlert("XFusion access is not configured yet. Ask the site administrator to set SUPABASE_URL and SUPABASE_ANON_KEY.","error"); return false; }
      setLoading(true);
      try{
        var redirectTo = window.location.origin + "/reset-password.html";
        var res = await window.sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
        setLoading(false);
        if(res.error){ showAlert(cleanMsg(res.error.message||res.error)||"Could not send the link. Try again.","error"); return false; }
        $("sentEmail").textContent = email;
        $("requestState").style.display="none";
        $("sentState").classList.add("show");
        startCooldown(60);
        return true;
      }catch(err){
        console.error("Forgot-password error:",err);
        setLoading(false);
        var raw=cleanMsg(err&&err.message);
        var net=/failed to fetch|networkerror|load failed|name_not_resolved|network request failed/i.test(String(raw||err)+"");
        showAlert(net?"Unable to reach the account service. Confirm SUPABASE_URL points to an active project.":(raw||"Could not send the link. Please try again."),"error");
        return false;
      }
    }

    document.addEventListener("DOMContentLoaded", async function(){
      if(window.SerlzoReady) await window.SerlzoReady;
      $("forgotForm").addEventListener("submit", function(e){ e.preventDefault(); sendLink(); });
      $("email").addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); $("forgotBtn").click(); } });
      $("resendBtn").addEventListener("click", function(){ sendLink(); });
    });
  })();
  </script>
  <!-- PASTE YOUR EXISTING FORGOT-PASSWORD SCRIPT BLOCK HERE -->
</body>
</html>
