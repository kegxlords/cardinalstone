<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#FF3D8B" />
  <title>XFusion — Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
  <style>
    /* ===== XFusion Plans — ONE section (catalog). JS-injected ids/classes preserved; purchase flow frozen. ===== */
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --xf-bg:#fff8fb;--xf-surface:#ffffff;--xf-surface-2:#fdf3f8;--xf-line:rgba(255,61,139,.14);
      --xf-text:#2b2330;--xf-mid:#4a3f52;--xf-muted:#6f6478;--xf-ph:#b8aec0;--xf-ink:#2b2330;
      --xf-accent:#d01563;--xf-accent-2:#ff3d8b;--xf-pink-soft:#ffe3ef;--xf-lemon:#ffe23d;--xf-yellow:#ffc93c;--xf-hero-dark:#8a0e42;--xf-success:#16a34a;--xf-danger:#e11d48;
      --xf-sweep:linear-gradient(135deg,#ff3d8b 0%,#ffc93c 55%,#ffe23d 100%);
      --xf-hero:linear-gradient(135deg,#8a0e42 0%,#d01563 50%,#ff3d8b 100%);
      --xf-ease:cubic-bezier(.23,1,.32,1);
      --xf-shadow-sm:0 8px 20px -12px rgba(208,21,99,.22);
    }
    body{background:radial-gradient(circle at 0% 0%,rgba(255,61,139,.06),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(255,226,61,.10),transparent 34rem),var(--xf-bg)!important;color:var(--xf-text)!important;min-height:100vh;padding-bottom:96px;font-family:'DM Sans',sans-serif}
    .page-wrap{width:100%;max-width:760px;margin:0 auto;padding-bottom:100px;background:transparent}

    /* topbar (chrome) */
    .topbar-premium{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 18px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--xf-line)}
    .tb-left{display:flex;flex-direction:column;min-width:0}
    .topbar-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:var(--xf-text);letter-spacing:-.01em}
    .tb-sub{font-size:11px;color:var(--xf-muted);font-weight:600;margin-top:2px;letter-spacing:.01em}
    .vip-badge{flex:0 0 auto;background:var(--xf-sweep);color:var(--xf-ink);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 4px 12px -4px rgba(208,21,99,.4)}

    /* THE one section: catalog */
    #productsList{padding:16px 16px 0}

    .product-card{position:relative;overflow:hidden;background:var(--xf-surface)!important;border:1px solid var(--xf-line)!important;border-radius:22px!important;
      margin:0 0 16px;box-shadow:var(--xf-shadow-sm)!important;transition:transform .18s var(--xf-ease),box-shadow .18s,border-color .18s}
    .product-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(208,21,99,.32)!important;border-color:var(--xf-accent-2)!important}

    .product-header{position:relative;overflow:hidden;padding:22px 20px;background:var(--xf-hero)!important}
    .product-header::before{content:'';position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,61,.34),transparent 68%)}
    .product-header::after{content:'';position:absolute;bottom:-90px;left:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
    .product-header.locked{background:linear-gradient(135deg,#9aa0ab 0%,#c2c7d0 100%)!important}
    .product-header.locked::before{background:radial-gradient(circle,rgba(255,255,255,.18),transparent 68%)}

    .product-type-badge{position:absolute;top:16px;right:16px;z-index:1;padding:4px 12px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
      background:rgba(255,255,255,.22);color:#fff!important;border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(4px)}
    .product-name{position:relative;z-index:1;color:rgba(255,255,255,.9);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
    .product-price{position:relative;z-index:1;color:#ffffff!important;font-size:clamp(28px,8vw,34px);font-weight:800;letter-spacing:-.03em;text-shadow:0 4px 16px rgba(0,0,0,.22)}

    .product-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--xf-line)}
    .pstat{background:var(--xf-surface);padding:15px 8px;text-align:center}
    .pstat-val{font-size:15.5px;font-weight:800;color:var(--xf-text);letter-spacing:-.02em}
    .pstat:nth-child(1) .pstat-val{color:var(--xf-accent)!important}      /* daily = pink */
    .pstat:nth-child(3) .pstat-val{color:var(--xf-success)!important}     /* total = green */
    .pstat-lbl{font-size:10.5px;color:var(--xf-muted);margin-top:4px;text-transform:uppercase;font-weight:800;letter-spacing:.05em}

    .product-footer{padding:15px 20px;border-top:1px solid var(--xf-line)}

    .btn-buy{position:relative;overflow:hidden;width:100%;min-height:50px;padding:14px;border:0;border-radius:15px;cursor:pointer;
      font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.01em;color:var(--xf-ink);background:var(--xf-sweep);
      box-shadow:0 12px 26px -10px rgba(208,21,99,.45);transition:transform .18s var(--xf-ease),box-shadow .18s,opacity .15s}
    .btn-buy::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%);transform:translateX(-120%);transition:transform .6s}
    .btn-buy:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(208,21,99,.55)}
    .btn-buy:hover:not(:disabled)::after{transform:translateX(120%)}
    .btn-buy:active:not(:disabled){transform:scale(.98)}
    .btn-buy:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .bought-chip,.locked-chip{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:14px;border-radius:15px;font-size:14px;font-weight:800}
    .bought-chip{background:rgba(22,163,74,.1);color:var(--xf-success)!important;border:1px solid rgba(22,163,74,.28)}
    .locked-chip{background:var(--xf-surface-2);color:var(--xf-muted)!important;border:1px solid var(--xf-line)}
    .bought-chip svg,.locked-chip svg{stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

    /* empty (JS-injected) */
    .empty-state{text-align:center;padding:60px 20px;color:var(--xf-muted)}
    .empty-state-icon{width:72px;height:72px;margin:0 auto 18px;background:var(--xf-pink-soft);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .empty-state-icon svg{width:34px;height:34px;stroke:var(--xf-accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .empty-state p{font-size:14px;line-height:1.6;font-weight:600}

    /* loader (initial, replaced by JS) */
    .loader-wrap{padding:60px 20px;display:flex;align-items:center;justify-content:center}
    .loader{width:32px;height:32px;border:3px solid var(--xf-pink-soft);border-top-color:var(--xf-accent);border-right-color:var(--xf-accent-2);border-radius:50%;animation:xfSpin .8s linear infinite}

    /* confirm modal (chrome — required for purchase) */
    .modal-backdrop{position:fixed;inset:0;background:rgba(43,35,48,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-backdrop.show{display:flex}
    .modal-content{background:var(--xf-surface);border:1px solid var(--xf-line);border-radius:26px;padding:26px;width:100%;max-width:420px;box-shadow:0 30px 70px -20px rgba(138,14,66,.5);animation:modalPop .3s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes modalPop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--xf-text);margin-bottom:4px;letter-spacing:-.01em}
    .modal-sub{font-size:13.5px;color:var(--xf-muted);margin-bottom:18px;line-height:1.5}
    .modal-details{background:var(--xf-surface-2);border:1px solid var(--xf-line);border-radius:16px;padding:16px;margin-bottom:18px}
    .modal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
    .modal-row:last-child{margin-bottom:0}
    .modal-label{color:var(--xf-muted);font-size:13.5px;font-weight:600}
    .modal-value{color:var(--xf-text);font-size:14px;font-weight:800}
    .modal-value.danger{color:var(--xf-danger)!important}
    .modal-value.success{color:var(--xf-success)!important}
    .modal-alert{padding:12px 14px;border-radius:13px;font-size:13px;font-weight:700;margin-bottom:16px;display:none;line-height:1.45}
    .modal-alert.show{display:block}
    .modal-alert.error{background:#ffe4e9;color:#9f1239;border:1px solid #ffc2cf}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn-modal{min-height:50px;padding:14px;border-radius:15px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;border:0;transition:transform .18s var(--xf-ease),box-shadow .18s,background .18s}
    .btn-modal.cancel{background:var(--xf-surface-2);color:var(--xf-mid)!important;border:1px solid var(--xf-line)}
    .btn-modal.cancel:hover{background:var(--xf-pink-soft)}
    .btn-modal.confirm{color:var(--xf-ink);background:var(--xf-sweep);box-shadow:0 12px 26px -10px rgba(208,21,99,.45)}
    .btn-modal.confirm:hover{transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(208,21,99,.55)}
    .btn-modal.confirm:active{transform:scale(.98)}
    .btn-modal.confirm:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

    /* bottom nav (chrome) */
    .bottom-nav-premium{position:fixed;bottom:0;left:0;right:0;z-index:100;display:grid;grid-template-columns:repeat(5,1fr);
      background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--xf-line);
      box-shadow:0 -6px 22px -10px rgba(208,21,99,.18);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
    .nav-item-premium{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;border:0;background:none;cursor:pointer;
      color:var(--xf-muted);font-size:10.5px;font-weight:700;font-family:inherit;transition:color .18s,transform .18s var(--xf-ease)}
    .nav-item-premium:hover{transform:translateY(-2px)}
    .nav-item-premium.active{color:var(--xf-accent)}
    .nav-icon-premium{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .nav-icon-premium svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    #toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--xf-text);color:#fff;
      padding:13px 22px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;z-index:300;
      box-shadow:0 14px 30px -10px rgba(43,35,48,.5);transition:opacity .28s ease,transform .28s var(--xf-ease);max-width:calc(100% - 32px);text-align:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @keyframes xfSpin{to{transform:rotate(360deg)}}
    @keyframes xfUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page-wrap>*{animation:xfUp .5s var(--xf-ease) both}
    .topbar-premium{animation:none}
    @media(min-width:820px){body{padding:24px 18px 40px}.page-wrap{padding:0 0 24px;border:1px solid var(--xf-line);border-radius:30px;background:var(--xf-surface);box-shadow:0 24px 60px -24px rgba(208,21,99,.22);overflow:hidden}.topbar-premium{border-radius:0}.bottom-nav-premium{display:none}body{padding-bottom:40px}}
    @media(max-width:380px){#productsList{padding-inline:12px}.product-price{font-size:28px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

<div class="page-wrap">
  <!-- Top Bar (chrome) -->
  <header class="topbar-premium">
    <div class="tb-left">
      <span class="topbar-title">Investment Plans</span>
      <span class="tb-sub">All gem plans · daily income · 60‑day terms</span>
    </div>
    <span class="vip-badge" data-vip>Member</span>
  </header>

  <!-- THE one section: catalog (JS fills this) -->
  <div id="productsList">
    <div class="loader-wrap"><div class="loader"></div></div>
  </div>
</div>

<!-- Confirm purchase modal (chrome — required by frozen purchase flow) -->
<div id="modal" class="modal-backdrop">
  <div class="modal-content">
    <h3 class="modal-title" id="modalTitle">Confirm Purchase</h3>
    <p class="modal-sub" id="modalSub">This product can only be purchased once.</p>
    <div class="modal-details" id="modalDetails"><!-- Populated by JS --></div>
    <div id="modalAlert" class="modal-alert"></div>
    <div class="modal-actions">
      <button class="btn-modal cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-modal confirm" id="confirmBtn" onclick="confirmPurchase()">Confirm</button>
    </div>
  </div>
</div>

<!-- Bottom Navigation (chrome) -->
<nav class="bottom-nav-premium" aria-label="Primary">
  <button class="nav-item-premium" onclick="location.href='dashboard.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><span>Home</span></button>
  <button class="nav-item-premium active" onclick="location.href='products.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div><span>Plans</span></button>
  <button class="nav-item-premium" onclick="location.href='team.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><span>Team</span></button>
  <button class="nav-item-premium" onclick="location.href='notifications.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><span>Alerts</span></button>
  <button class="nav-item-premium" onclick="location.href='profile.html'"><div class="nav-icon-premium"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span>Profile</span></button>
</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/serlzo.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script>
(function(){
  "use strict";
  /* DELTA 1: dropped unused activeTab var */
  var userId="", userVip=0, walletBal=0, userPlans=[], pendingPlanId="";

  function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}

  waitSb(async function(){
    var s = await window.SerlzoAuth.requireAuth(); if(!s)return;
    userId=s.user.id;

    var {data:p} = await window.sb.from("profiles").select("vip_level").eq("id",userId).single();
    userVip = p?.vip_level||0;
    await window.SerlzoAuth.loadProfile(userId);

    var {data:w} = await window.sb.from("wallets").select("balance").eq("user_id",userId).single();
    walletBal = w?.balance||0;

    var {data:up} = await window.sb.from("user_products").select("product_id").eq("user_id",userId);
    userPlans = (up||[]).map(function(x){return x.product_id;});

    /* DELTA 1b: load all plans in one list (no tab) */
    await loadPlans();
  });

  /* DELTA 2: switchTab removed entirely (no tab rail) */

  /* DELTA 3: loadPlans() loads ALL products; per-card type/lock derived from each row */
  async function loadPlans(){
    var el = document.getElementById("productsList");
    el.innerHTML = '<div class="loader-wrap"><div class="loader"></div></div>';

    var {data:prods} = await window.sb.from("products").select("*").order("sort_order");

    if(!prods||!prods.length){
      el.innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg></div><p>No plans available yet.</p></div>';
      return;
    }

    el.innerHTML = prods.map(function(p){
      var pType = p.type || "newbie";
      var pVip  = parseInt(p.vip_level||0,10);
      var locked = p.status==="locked" || (pType==="vip" && userVip<pVip);
      var bought = userPlans.includes(p.id);
      var hdrClass = locked ? 'product-header locked' : 'product-header';
      var badgeText = pType==="vip" ? ("Tier "+pVip) : "General";
      var lockReason = p.status==="locked" ? "Locked by Admin" : ("Tier "+pVip+" Required");

      return '<div class="product-card">'+
        '<div class="'+hdrClass+'">'+
          '<div class="product-type-badge">'+badgeText+'</div>'+
          '<div class="product-name">'+p.name+'</div>'+
          '<div class="product-price">'+window.SerlzoAuth.money(p.price)+'</div>'+
        '</div>'+
        '<div class="product-stats">'+
          '<div class="pstat"><div class="pstat-val">'+window.SerlzoAuth.money(p.daily_income)+'</div><div class="pstat-lbl">Daily</div></div>'+
          '<div class="pstat"><div class="pstat-val">'+p.duration_days+'d</div><div class="pstat-lbl">Duration</div></div>'+
          '<div class="pstat"><div class="pstat-val">'+window.SerlzoAuth.money(p.total_return)+'</div><div class="pstat-lbl">Total</div></div>'+
        '</div>'+
        '<div class="product-footer">'+
          (bought
            ? '<div class="bought-chip"><svg width="16" height="16" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> Already Purchased</div>'
            : locked
              ? '<div class="locked-chip"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> '+lockReason+'</div>'
              : '<button class="btn-buy" onclick="openModal(\''+p.id+'\',\''+p.name+'\','+p.price+')">Buy Now</button>'
          )+
        '</div>'+
      '</div>';
    }).join("");
  }

  /* ===== FROZEN BELOW: purchase flow byte-identical ===== */
  window.openModal = function(id, name, price){
    pendingPlanId = id;
    document.getElementById("modalTitle").textContent = "Buy " + name;
    document.getElementById("modalSub").textContent = "This plan can only be purchased once per account.";
    document.getElementById("modalDetails").innerHTML =
      '<div class="modal-row"><span class="modal-label">Plan Price</span><strong class="modal-value">'+window.SerlzoAuth.money(price)+'</strong></div>'+
      '<div class="modal-row"><span class="modal-label">Available Balance</span><strong class="modal-value '+(walletBal>=price?'success':'danger')+'">'+window.SerlzoAuth.money(walletBal)+'</strong></div>'+
      (walletBal < price ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:13px;color:#ef4444;font-weight:600;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Insufficient balance. Please deposit funds first.</div>' : '');

    document.getElementById("modalAlert").className="modal-alert";
    var modal=document.getElementById("modal");
    modal.classList.add("show");
    document.getElementById("confirmBtn").disabled = walletBal < price;
  };

  window.closeModal = function(){
    document.getElementById("modal").classList.remove("show");
    pendingPlanId="";
  };

  window.confirmPurchase = async function(){
    var btn=document.getElementById("confirmBtn");
    var alertEl=document.getElementById("modalAlert");
    btn.disabled=true; btn.textContent="Processing…";
    alertEl.className="modal-alert";

    var {data,error} = await window.sb.rpc("purchase_product",{p_product_id:pendingPlanId});

    if(error||!data?.ok){
      alertEl.textContent = data?.error||error?.message||"Purchase failed.";
      alertEl.className="modal-alert error show";
      btn.disabled=false; btn.textContent="Confirm"; return;
    }

    window.SerlzoAuth.toast("Plan purchased successfully!");
    closeModal();

    // Refresh data
    var {data:w}=await window.sb.from("wallets").select("balance").eq("user_id",userId).single();
    walletBal=w?.balance||0;
    var {data:up}=await window.sb.from("user_products").select("product_id").eq("user_id",userId);
    userPlans=(up||[]).map(function(x){return x.product_id;});
    /* DELTA 4: refresh without tab arg */
    await loadPlans();
  };

  // Close modal on backdrop click
  document.getElementById("modal").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
})();
</script>
</body>
