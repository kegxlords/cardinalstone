<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#D90429" />
  <title>Redpay — Plans</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css" />
  <link rel="stylesheet" href="assets/css/redpay.css" />

  <style>
    .tb-left{display:flex;flex-direction:column;min-width:0}
    .tb-sub{font-size:11px;color:var(--rp-muted);font-weight:700;margin-top:2px;letter-spacing:.01em}
    #productsList{padding:16px 16px 0}
    #modalDetails div[style*="#ef4444"]{
      color:var(--rp-danger) !important;
      border-top-color:var(--rp-line) !important;
    }
    @media (max-width:380px){
      #productsList{padding-inline:12px}
      .product-price{font-size:28px}
    }
  </style>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">

  <div class="page-wrap rp-fade-up">

    <header class="topbar-premium">
      <div class="tb-left">
        <div class="topbar-title">Investment Plans</div>
        <div class="tb-sub">All plans · daily income · secure checkout</div>
      </div>
      <span class="vip-badge default-badge" data-vip>Member</span>
    </header>

    <div id="productsList">
      <div class="loader-wrap"><div class="loader"></div></div>
    </div>

  </div>

  <div id="modal" class="modal-backdrop">
    <div class="modal-content">
      <h3 class="modal-title" id="modalTitle">Confirm Purchase</h3>
      <p class="modal-sub" id="modalSub">This product can only be purchased once.</p>
      <div class="modal-details" id="modalDetails"></div>
      <div id="modalAlert" class="modal-alert"></div>
      <div class="modal-actions">
        <button class="btn-modal cancel" type="button" onclick="closeModal()">Cancel</button>
        <button class="btn-modal confirm" type="button" id="confirmBtn" onclick="confirmPurchase()">Confirm</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav-premium" aria-label="Primary">
    <button class="nav-item-premium" type="button" onclick="location.href='dashboard.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <span>Home</span>
    </button>

    <button class="nav-item-premium active" type="button" onclick="location.href='products.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </div>
      <span>Plans</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='team.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <span>Team</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='notifications.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <span>Alerts</span>
    </button>

    <button class="nav-item-premium" type="button" onclick="location.href='profile.html'">
      <div class="nav-icon-premium">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Profile</span>
    </button>
  </nav>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/icons.js" defer></script>

  <script>
  (function(){
    "use strict";
    var userId="", userVip=0, walletBal=0, userPlans=[], pendingPlanId="";

    function waitSb(cb){if(window.sb&&window.SerlzoAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.SerlzoAuth){clearInterval(t);cb();}},50);}

    waitSb(async function(){
      var s = await window.SerlzoAuth.requireAuth(); if(!s)return;
      userId=s.user.id;

      var {data:p} = await window.sb.from("profiles").select("vip_level").eq("id",userId).single();
      userVip = p?.vip_level||0;
      await window.SerlzoAuth.loadProfile(userId);

      var {data:w} = await window.sb.from("wallets").select("balance").eq("user_id",userId).single();
      walletBal = w?.balance||0;

      var {data:up} = await window.sb.from("user_products").select("product_id").eq("user_id",userId);
      userPlans = (up||[]).map(function(x){return x.product_id;});

      await loadPlans();
    });

    async function loadPlans(){
      var el = document.getElementById("productsList");
      el.innerHTML = '<div class="loader-wrap"><div class="loader"></div></div>';

      var {data:prods} = await window.sb.from("products").select("*").order("sort_order");

      if(!prods||!prods.length){
        el.innerHTML='<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg></div><p>No plans available yet.</p></div>';
        return;
      }

      el.innerHTML = prods.map(function(p){
        var pType = p.type || "newbie";
        var pVip  = parseInt(p.vip_level||0,10);
        var locked = p.status==="locked" || (pType==="vip" && userVip<pVip);
        var bought = userPlans.includes(p.id);
        var hdrClass = locked ? 'product-header locked' : 'product-header';
        var badgeText = pType==="vip" ? ("Tier "+pVip) : "General";
        var lockReason = p.status==="locked" ? "Locked by Admin" : ("Tier "+pVip+" Required");

        return '<div class="product-card">'+
          '<div class="'+hdrClass+'">'+
            '<div class="product-type-badge">'+badgeText+'</div>'+
            '<div class="product-name">'+p.name+'</div>'+
            '<div class="product-price">'+window.SerlzoAuth.money(p.price)+'</div>'+
          '</div>'+
          '<div class="product-stats">'+
            '<div class="pstat"><div class="pstat-val">'+window.SerlzoAuth.money(p.daily_income)+'</div><div class="pstat-lbl">Daily</div></div>'+
            '<div class="pstat"><div class="pstat-val">'+p.duration_days+'d</div><div class="pstat-lbl">Duration</div></div>'+
            '<div class="pstat"><div class="pstat-val">'+window.SerlzoAuth.money(p.total_return)+'</div><div class="pstat-lbl">Total</div></div>'+
          '</div>'+
          '<div class="product-footer">'+
            (bought
              ? '<div class="bought-chip"><svg width="16" height="16" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> Already Purchased</div>'
              : locked
                ? '<div class="locked-chip"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> '+lockReason+'</div>'
                : '<button class="btn-buy" type="button" onclick="openModal(\''+p.id+'\',\''+p.name+'\','+p.price+')">Buy Now</button>'
            )+
          '</div>'+
        '</div>';
      }).join("");
    }

    window.openModal = function(id, name, price){
      pendingPlanId = id;
      document.getElementById("modalTitle").textContent = "Buy " + name;
      document.getElementById("modalSub").textContent = "This plan can only be purchased once per account.";
      document.getElementById("modalDetails").innerHTML =
        '<div class="modal-row"><span class="modal-label">Plan Price</span><strong class="modal-value">'+window.SerlzoAuth.money(price)+'</strong></div>'+
        '<div class="modal-row"><span class="modal-label">Available Balance</span><strong class="modal-value '+(walletBal>=price?'success':'danger')+'">'+window.SerlzoAuth.money(walletBal)+'</strong></div>'+
        (walletBal < price ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:13px;color:#ef4444;font-weight:600;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Insufficient balance. Please deposit funds first.</div>' : '');

      document.getElementById("modalAlert").className="modal-alert";
      var modal=document.getElementById("modal");
      modal.classList.add("show");
      document.getElementById("confirmBtn").disabled = walletBal < price;
    };

    window.closeModal = function(){
      document.getElementById("modal").classList.remove("show");
      pendingPlanId="";
    };

    window.confirmPurchase = async function(){
      var btn=document.getElementById("confirmBtn");
      var alertEl=document.getElementById("modalAlert");
      btn.disabled=true; btn.textContent="Processing…";
      alertEl.className="modal-alert";

      var {data,error} = await window.sb.rpc("purchase_product",{p_product_id:pendingPlanId});

      if(error||!data?.ok){
        alertEl.textContent = data?.error||error?.message||"Purchase failed.";
        alertEl.className="modal-alert error show";
        btn.disabled=false; btn.textContent="Confirm"; return;
      }

      window.SerlzoAuth.toast("Plan purchased successfully!");
      closeModal();

      var {data:w}=await window.sb.from("wallets").select("balance").eq("user_id",userId).single();
      walletBal=w?.balance||0;
      var {data:up}=await window.sb.from("user_products").select("product_id").eq("user_id",userId);
      userPlans=(up||[]).map(function(x){return x.product_id;});
      await loadPlans();
    };

    document.getElementById("modal").addEventListener("click", function(e){
      if(e.target === this) closeModal();
    });
  })();
  </script>
</body>
</html>
